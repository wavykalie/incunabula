# CANON LEDGER — Sons of Heaven, Students of Dust (WORKING TITLE)
#
# Scope: this project only (single book, no series). Series scope is declared empty
# rather than omitted, so a reader can tell "no series" from "series not recorded".
#
# Every fact carries provenance. A fact whose authority is `inference` is NOT canon;
# it is a hypothesis. Conflicts are never resolved by overwriting one value with
# another: both values stay, and a CONF record is raised.

meta:
  ledger_version: 1
  book: "sons-of-heaven-students-of-dust"
  series: null
  series_scope_note: "Standalone. No series contract exists; nothing is scoped above this book."
  created: "2026-09-25"
  last_verified: "2026-09-25"

