    value_b: "Author may prefer a first-person historian's 'I'."
    provenance_a: "artifacts/00-brief.md narrative mode"
    provenance_b: "ASSUMPTIONS.md A-16 (unresolved at intake)"
    blocking_scope: "voice only; drafting proceeds third-person"
    raised: "2026-09-25"

