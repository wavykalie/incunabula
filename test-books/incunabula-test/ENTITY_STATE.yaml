# ----------------------------------------------------------- information flow
# Who may act on what, and when. The drafting skill must not let a figure know
# something before it exists.
knowledge_gates:
  - { id: KG-01, fact: "the Records of the Grand Historian", available_from: "after c. 91 BCE", note: "Chapters 1, 2, 4, 5 are narrated through a text written later. The narrator may use it; the figures may not." }
  - { id: KG-02, fact: "the Bodhidharma interview", available_from: "tradition, centuries later", note: "Ch 6 must present it as tradition and say so." }
  - { id: KG-03, fact: "the Zhenguan record", available_from: "compiled after Taizong's death", note: "Ch 8 may use it, marked as the record Taizong knew would be written." }
  - { id: KG-04, fact: "An Lushan's casualty figures", available_from: "later estimates", note: "Ch 10 must flag the death toll as an estimate, not a count." }

