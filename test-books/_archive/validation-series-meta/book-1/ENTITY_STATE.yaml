# ------------------------------------------------------------------- rules
world_rules:
  - id: "R-001"
    rule: "the welcome is genuine; there is no antagonist, no transformation, no absorption"
    source: "foundation.md -> The engine"
  - id: "R-002"
    rule: "hospitality is itself the mechanism: staying is what kills them, and nothing convinces anyone to stay"
    source: "PROJECT_STATE.yaml -> decisions (user choice)"
  - id: "R-003"
    rule: "the only available action is to leave, and the world is arranged to make leaving feel unnecessary"
    source: "foundation.md -> The engine"
  - id: "R-004"
    rule: "the beings grew from the dead and do not know it. They are NOT the dead themselves"
    source: "PROJECT_STATE.yaml -> decisions (user correction)"
  - id: "R-005"
    rule: "the horror has two halves: the pile of everyone who came before, and the beings' innocence"
    source: "foundation.md -> The engine"
  - id: "R-006"
    rule: "no being ever states, explains or hints at the truth (decision C)"
    source: "foundation.md -> Writer warning 10"
  - id: "R-007"
    rule: "nothing is lost in this book; the ending is growth, not damage"
    source: "PROJECT_STATE.yaml -> decisions (user decision)"
  - id: "R-008"
    rule: "nothing on the planet is named; constellation names are permitted on the page"
    source: "foundation.md -> Naming rule"
  - id: "R-009"
    rule: "visitors still die here. The mortality is real. Not selected: 'no present danger'"
    source: "foundation.md -> Tone and movement"
  - id: "R-010"
    rule: "no competence cascade; Merope solves nothing"
    source: "foundation.md -> Writer warning 5"
  - id: "R-011"
    rule: "no VISITOR remains, anywhere, ever. Remains of something that was not a person are permitted"
    source: "CANON_LEDGER.yaml -> CONF-005 (resolved 2026-09-22; the wider 'no bodies anywhere' wording was the agent's over-generalisation)"
  - id: "R-012"
    rule: "nothing threatens them, ever - no chase, no pursuit, no last-minute danger. The sleigh's decision is the saving act, but no rescue scene is written"
    source: "CANON_LEDGER.yaml -> CONF-007 (resolved 2026-09-22)"

# ----------------------------------------------------------------- timeline
timeline:
  - id: "T-001"
    when: "ch.1, night"
    event: "the sleigh in transit; the steed is shaped as Delphinus; Merope narrates the piloting as hers"
    source: "chapter-01.md"
  - id: "T-002"
    when: "ch.1, morning"
    event: "landing; the light is easy; the growth reads as arranged"
  - id: "T-003"
    when: "ch.1, same morning"
    event: "the beings come, all at once, and are glad"
  - id: "T-004"
    when: "ch.1, evening"
    event: "Achird finds ITM-001 and pockets it; Merope does not go and look"
  - id: "T-005"
    when: "ch.2, day two"
    event: "the welcome cut in two halves; Achird shows Merope ITM-001; a being answers her question about it, honestly and emptily"
    status: "drafted"
    source: "scene-packets/chapter-02.md (day fixed 2026-09-22 - it was previously undefined as 'the same day')"
  - id: "T-006"
    when: "ch.3, day three onward"
    event: "days stop behaving; the same day happens three times; Achird finds the non-plant shape and ITM-002; Merope looks at ITM-002 and dismisses it"
    status: "drafted"
  - id: "T-007"
    when: "ch.4"
    event: "LOC-004 found: belongings with no owners, laid out with care, no visitor remains"
    status: "drafted"
  - id: "T-008"
    when: "ch.5, spanning the span behind the shelf"
    event: "told in reverse: the welcome, the habit, the growth, the fact - everyone who came here died here, and the beings grew from them. Achird stops arguing"
    status: "drafted"
    note: "The reverse structure covers an indefinite span. The exact number of days is STILL OPEN - do not fix a number."
    scale_determined: "WEEKS. Not decided, determined by the prose: ch.5 'her first week', ch.6 'I had stopped counting them weeks ago' and 'it had not moved in all the weeks', ch.7 'for weeks before I left' and 'weeks before'. Five consistent uses. Recorded as CONT-007: the scale arrived through prose rather than through the ledger, which is the drift class this layer exists to catch. If months or years was intended, ch.6 and ch.7 both need edits."
  - id: "T-009"
    when: "ch.6"
    event: "Achird's one sentence; Merope refuses and turns cruel; the sleigh moves on its own and Merope follows, still talking"
    status: "drafted"
  - id: "T-010"
    when: "ch.7"
    event: "the departure; nobody stops them and the beings are glad to see them go; Merope looks at Achird at last and the acknowledgement happens, sideways"
    status: "drafted"

# --------------------------------------------------------------------- open
conflicts:
  note: "The records live in CANON_LEDGER.yaml. These are pointers; do not restate or resolve them here."
  resolved: ["CONF-001", "CONF-002", "CONF-003", "CONF-004", "CONF-005", "CONF-006", "CONF-007", "CONF-008", "CONF-009", "CONF-010"]
  open: []

appearance:
  note: >-
    Recorded as the author gave it, with the gaps left VISIBLE rather than filled in. Three items are
    flagged below instead of being silently resolved, because guessing at a design brief is how an
    inference becomes canon. Authority: user_decision, 2026-09-22.
  prose_state: >-
    IMPORTANT AND RECORDED DELIBERATELY: the drafted manuscript describes NEITHER lead physically
    anywhere in 15,531 words. First-person narration never describes the narrator; Merope never
    describes Achird's appearance either. Verified by grep for hair, dress, hoodie, cloak, chest,
    height and colour across all seven chapters - the only hits are incidental ("moved it a hair to
    the left", "not short of material", "dress it up"). This is now a POSITION rather than an
    oversight: the appearance is canon for illustration and packaging, and the prose stays silent.
    It is also what makes the voice-dna cover-the-name test passable. If the author wants the prose to
    describe them, that is a separate decision and a change to the narrator contract.
  age_note: "Both are 19 and adults (content_boundaries, corrected by the author). Any illustration brief must treat them as adults, not as minors - the earlier build recorded them as minors and that was corrected for a reason."
  wording_flags:
    - id: "APPEAR-1"
      item: "Merope's chest - the author's word was 'boasty'"
      status: "RESOLVED 2026-09-22: BUSTY / FULL-FIGURED, and it is a stated deliberate contrast with Achird rather than an incidental detail. The original word was the author's 'boasty', which is not standard usage; it was left unguessed until confirmed, and that is why it is worth recording that the resolution came from the author and not from this pipeline."
    - id: "APPEAR-2"
      item: "Achird's 'scorpia like' hair"
      status: "RESOLVED 2026-09-22: a SCORPION-TAIL BRAID. One long tail curving like a scorpion's tail, crimson. Chosen over a swept asymmetric cut and over a full scorpion silhouette. It reads at thumbnail scale, which is why it matters for a cover."
    - id: "APPEAR-3"
      item: "Achird's hair and SCORPIUS - a story-level implication, raised not decided"
      status: "RESOLVED 2026-09-22: COINCIDENCE, AND THE AUTHOR LIKES IT. Explicitly NOT a designed resonance. Three consequences, recorded so the decision cannot drift: (1) it is NOT seeded into Book 2's design language - no other character echoes a constellation; (2) it is NOT remarked on in either book, by anyone, ever; (3) the hair shape is NOT changed to avoid the read. A reader who connects the braid to ch.7's Scorpius is over-reading, and that is a fine thing to let happen. NOTHING IN THE PROSE WAS CHANGED, before or after this decision."
    - id: "APPEAR-4"
      item: "'nuclear superbubbles' on the hoodie"
      status: "READ, and low-risk: nested glowing shells with brighter rims - the real astronomical feature (cavities in the interstellar medium blown out by supernovae and stellar winds). Unlike APPEAR-1, the phrase is unambiguous in astronomy, so this is a reading rather than a guess. Still recorded as this pipeline's interpretation rather than an author statement, and the only appearance flag left open."

open_questions:
  - "whether anything else is alive on the planet - NOT DECIDED"
  - "whether the beings approach these visitors differently than they approached prior ones - NOT DECIDED"
  - "the exact number of days they have been here when the shelf is found - NOT DECIDED. The SCALE is determined as weeks by the prose (see T-008)."
  - "chapter titles - STILL DEFERRED after drafting, as instructed. Book 1 shipped as a validation build with the working title 'Merope / Book One' and the drafting labels for chapters."
  - "AUTH-5 CLOSED 2026-09-22 - both leads' physical appearance is now author-decided canon. See this file's `appearance` block for the record, the three wording flags (APPEAR-1..3) and the interpretation flag (APPEAR-4). The prose still describes neither of them, which is now a recorded position rather than a gap."
  - "AUTH-1 CLOSED 2026-09-22 - the ch.6 cruelty line was rewritten to two clipped sentences of 20 words and the gate was re-run PASS. Superseded wording preserved in CANON_LEDGER.yaml -> merope.cruelty_line.supersedes."
  - "AUTH-2 CLOSED 2026-09-22 - LEFT REMOVED. The reason was upgraded from 'unshown' to GEOGRAPHICALLY IMPOSSIBLE: the shelf is in the camp, out past the far edge of the growth and over a rise (ch.4), and ch.6 has Achird standing still throughout the confrontation ('She stood there.' / 'She said nothing.'), so she never leaves the clearing and comes back. The clause could not have happened when ch.7 said it did. If the beat is wanted it belongs in an EARLIER scene - Achird going up to the camp alone - which is Phase 2 work, not a patch."
  - "AUTH-3 ch.5's reverse-frame wording ('described already'); ch.4's shelf strap vs ch.5's buried strap - two prose judgement calls"
  - "AUTH-6 the stay is weeks by manuscript implication - confirm or change"
