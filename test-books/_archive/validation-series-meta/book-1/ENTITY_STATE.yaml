# ENTITY_STATE.yaml - Phase 2.7 BUILD, then UPDATE (2026-09-22)
#
# The structured entity, knowledge, timeline and world-rule state.
# Facts and their authority live in CANON_LEDGER.yaml; this file is the entity-shaped view of them.
#
# IDs are STABLE AND SERIES-WIDE. Book 2 loads these and reuses them; a character may gain facts,
# never a new ID. Anything scoped to one book says so explicitly.
#
# UPDATE pass 2026-09-22 closed six gaps the Phase 2.8 audit and the ledger both flagged:
#   1. no provenance anywhere (now: source + authority + last_verified per entity)
#   2. the ch.3 object existed in the packet but had no entity, which is why CRIT-003 had nothing
#      to check against (now: ITM-002)
#   3. LOC-004 and LOC-005 were the same place, double-counted (now: merged, LOC-005 retired)
#   4. no timeline entry for ch.2 or ch.5
#   5. Achird's speech budget was inconsistent across four documents (CRIT-001; now one rule)
#   6. Merope's recorded knowledge omitted a claim she actually hears in ch.1

meta:
  built: "2026-09-22"
  mode: "UPDATE"
  last_update: "2026-09-22"
  maintenance_run: 2
  sources: ["foundation.md", "outline.md", "voice-dna.md", "INTAKE.md", "manuscript/chapters/chapter-01..07.md", "CANON_LEDGER.yaml", "continuity/manuscript-audit.md"]
  id_policy: "stable across the series; new facts are appended to the entity, never re-issued"
  scope: "book-1"
  update_2_note: >-
    Second UPDATE pass, run 2026-09-22 after all seven chapters existed: closes CONT-008 (ITM-001's form
    was stale and contradicted by prose), CONT-009 (the ch.3 curve had no entity ID), CONT-007 (the
    timeline scale is weeks by manuscript determination) and the ITM-003 must_not narrowing owed under
    CONF-005. All statuses advanced from 'planned' to 'drafted'.
  provenance_policy: >-
    Every entity carries `source` (file + section) and `last_verified`. Where a value is contested,
    `conflict` points at the CANON_LEDGER.yaml conflict record rather than restating it. Nothing here
    is authoritative on its own: CANON_LEDGER.yaml decides which value is current.
  renumbering: "ITM-002 was 'the remaining belongings' (planned, never referenced in prose). It is now ITM-003. The ch.3 object takes ITM-002."

# ----------------------------------------------------------------- characters
characters:
  CHR-001:
    name: "Merope"
    role: "protagonist, first-person narrator"
    age: 19
    type: "human"
    source: "foundation.md -> Characters -> MEROPE; PROJECT_STATE.yaml -> project.content_boundaries"
    last_verified: "2026-09-22"
    voice_card: "voice-dna.md -> Voice cards -> MEROPE"
    given_voice: "grandiose and certain; narrates herself as the centre; under pressure boastful, then cruel"
    given_trait: "tsundere; cannot be direct about what she feels"
    want: "to be watched"
    want_legible: false            # never stated in the text; must be inferable by ch.1 end
    arc: "she does not become good, and she does NOT CHOOSE. The sleigh decides and she is carried. What changes is that she looks: on the way out she sees Achird properly, for the first time in the book."
    arc_superseded_value: "she takes one step against her own appetite: she leaves"
    conflict: "CONF-006 (resolved, user decision 2026-09-22) - foundation.md updated to match"
    knows:
      - "that they arrived at a world not on any chart"
      - "that Achird picked up an object (ch.1, from a distance; never examined)"
      - "that Achird said the object was somebody's, lost (ch.1, heard, not followed up)"
    does_not_know:
      - "what the beings are"
      - "that anyone died here"
      - "that Achird is in love with her (until ch.7)"
    speech_budget:
      ch_6: "the cruelty. Boastful, then one short accurate line delivered quietly. Sentences get LONGER before she gets cruel. APPLIED AND MET 2026-09-22 (closes AUTH-1): the drafted cruelty ran 30 words in a single triple-clause, which was the LONGEST thing Merope said in the chapter rather than the shortest. It is now two clipped sentences of 20 words. The length moved out of the dialogue and into the narration around it, which is where the swelling already was."
    physical_appearance: "AUTHOR DECISION 2026-09-22, closes AUTH-5. White hair worn in twin tails. A celestial-themed Lolita dress. Busty / full-figured, stated as a deliberate contrast with Achird."

  CHR-002:
    name: "Achird"
    role: "co-protagonist; the one who acts"
    age: 19
    type: "human"
    source: "foundation.md -> Characters -> ACHIRD"
    last_verified: "2026-09-22"
    voice_card: "voice-dna.md -> Voice cards -> ACHIRD"
    given_voice: "short declaratives, no performed emotion; flatness is attention, not absence"
    want: "to be seen by Merope specifically"
    function: "she acts; she is the reason they leave"
    structural_role: "finds the belongings first and is not believed; the middle of the book is her unable to be heard"
    knows:
      - "that the first object is not from here and not grown here (ch.1)"
      - "that the hands are what the beings do instead of a greeting (ch.1)"
    does_not_know:
      - "what the beings are (until ch.5, assembled by her, not told)"
    escalation_mode: "quieter and shorter under pressure; silence, not argument"
    speech_budget:
      note: "CRIT-001. This was specified four incompatible ways; it is now one rule. Do not let a later packet drift back to 'mute'."
      ch_1: "short lines; one report allowed to run to a full sentence (the hands)"
      ch_2: "short and normal. She is not sad and not excluded; the problem is that the beings like her too"
      ch_3: "two warnings, plain, correct, unremarkable - the same sentence twice"
      ch_4: "she counts, and asks her question once"
      ch_5: "STOPS ARGUING AND EXPLAINING. States the fact once and stops. Not mute."
      ch_6: "ONE SENTENCE, plus at most one word. The largest moment in the book. Give her no second line."
      ch_7: "SILENT. Nothing at all."
    physical_appearance: "AUTHOR DECISION 2026-09-22, closes AUTH-5. Flat-chested. Crimson hair in a SCORPION-TAIL BRAID - one long tail curving like a scorpion's tail. A hoodie designed after nuclear superbubbles."

  COL-001:
    name: "the beings"
    role: "collective character; the planet's welcome, embodied"
    type: "collective, person-shaped, unnamed"
    source: "foundation.md -> Characters -> THE BEINGS; ENTITY_STATE BUILD 2026-09-22"
    last_verified: "2026-09-22"
    count: "many; exact count deliberately unstable and never fixed (ch.1 executes this: 31, then a different number)"
    given_voice: "friendly, inviting, genuinely glad; cannot lie and cannot explain"
    knows:
      - "nothing about what they are"
    does_not_know:
      - "that they grew from the dead"
      - "that any visitor has ever died here"
    rules:
      - "never lie"
      - "never explain, hint, warn, or withhold"
      - "never become sinister, hostile, or defensive"
      - "no individual is ever their spokesperson (decision C)"
    answer_boundary: "RESOLVED - CONF-003, applied 2026-09-22. A being may answer only from POSSESSION and PRESENT TENSE (what a thing is called here, where it goes, that it is good); never from ORIGIN or OWNERSHIP. Drafted in ch.2: 'That is a good one' / 'Not ours' / it goes on the shelf."
    tell_not_known_to_anyone: "they smell of cut stems; their hands are warm"

# ------------------------------------------------------------------ vehicle
  OBJ-001:
    name: "the sleigh"
    role: "vehicle; the only thing in the book that can act without anyone deciding"
    source: "foundation.md -> Characters -> THE SLEIGH; chapter-01.md"
    last_verified: "2026-09-22"
    description: "old-style enclosed cabin on runners; glazed with old, not-quite-clear glass; wood runners"
    travels: "the dark between worlds"
    steed: "a constellation that has taken a shape and holds it; the shape moves as the constellation moves"
    steed_conflict: "CLOSED - CONF-004, resolved 2026-09-22. The constellation is both the road and the shape: the sleigh runs along it and wears its form while moving; when parked, the constellation goes on about its own line and the shape goes with it. Ch.1 is correct under this reading and was left unedited. Ch.7 drafts the handover (Delphinus gone, Scorpius forming)."
    steed_examples: ["Delphinus, as a dolphin (ch.1)", "Scorpius, as a scorpion"]
    ownership: "Achird's"
    narration_rule: "Merope narrates as though SHE were piloting it, and never mentions Achird AT THE CONTROLS. (Wording narrowed 2026-09-22: as 'never mentions Achird's hands' the rule was falsified by a legitimate ch.1 line about a hand in a pocket.)"
    agency: "it chooses as well as being chosen; if it needs to save someone, it will"
    agency_note: "CONF-007 (resolved): its act in ch.6 IS the saving - staying is what kills her. Meaning, not a rescue scene. Write no rescue; forbid no meaning."
    acts_without_decision_in: ["ch.6"]

# ---------------------------------------------------------------- locations
locations:
  LOC-001:
    name: "the world without a name"
    scope: "book-1 only"
    source: "foundation.md -> Naming rule; chapter-01.md"
    last_verified: "2026-09-22"
    description: "not on any chart; easy light; nothing about arriving is difficult; visitors who stay, die here"
    rule: "NEVER NAMED on the page"
    note: "ch.1 says it 'does not have a name I am willing to use', which implies she has one available. Audit WARN-003 - consider 'does not have a name'."
  LOC-002:
    name: "the clearing"
    source: "scene-packets/chapter-01.md"
    last_verified: "2026-09-22"
    description: "the arrival site; hedges arranged with room in them, the way seats are arranged; a low old bench facing the middle"
    rule: "the arrangement predates them and is routine and old (decision A)"
  LOC-003:
    name: "the hedges / the growth"
    source: "foundation.md -> The engine"
    last_verified: "2026-09-22"
    description: "grows in shapes that have room in them; oriented, not threatening; grew from the dead"
  LOC-004:
    name: "the camp"
    first_referenced: "ch.4"
    source: "scene-packets/chapter-04.md"
    last_verified: "2026-09-22"
    description: "a place people lived; nothing broken, nothing buried, nothing left in a hurry; a shelf of small belongings laid out with care; no visitor remains"
    access: "Achird leads her there by the hand"
    status: drafted
  LOC-005:
    name: "somewhere Achird leads her"
    first_referenced: "ch.4"
    status: "RETIRED"
    merged_into: "LOC-004"
    reason: "Audit MINOR-003: the same place, double-counted. LOC-004 is the camp and this was the walk to it. Kept as retired rather than deleted, per the maintenance protocol."

# ------------------------------------------------------------------ objects
items:
  ITM-001:
    name: "the first object"
    introduced: "ch.1"
    found_by: "CHR-002"
    source: "manuscript/chapters/chapter-01.md"
    last_verified: "2026-09-22"
    description: "a button. Bone-white, a single hole worked through one end, the work too fine to be from here. FORM ESTABLISHED BY PROSE 2026-09-22 (CONT-008) - ch.2 specifies it ('small... white, or it had been. There was a hole worked through one end of it, and the work was fine') and ch.4 names it ('my button. The white one.'). The BUILD-mode 'four holes' was an invention of this STATE FILE that never reached the page; it is superseded and must not be reintroduced."
    seen_by_merope: "yes, ch.2 - Achird shows it to her and she laughs at it and hands it back"
    status: "on the ch.4 shelf among the rest"
    evidence_value: "first object; establishes that the pile is belongings, not remains"
    must_not: "be treated as significant by Merope in ch.1"
  ITM-002:
    name: "the second object"
    introduced: "ch.3"
    found_by: "CHR-002"
    source: "scene-packets/chapter-03.md pass 2"
    last_verified: "2026-09-22"
    description: "found by Achird; she asks Merope to come and look"
    seen_by_merope: "YES - ch.3 pass 2, and this is now required, not optional (CRIT-003 fix). She comes, looks, decides it is not worth looking at, and does not remember it an hour later"
    status: "planned; ends on the ch.4 shelf among the rest"
    evidence_value: "ch.4 has her RECOGNISE it on the shelf, so she must have seen it. The dismissal is also what makes ch.5's reversal cost her something: she looked, and waved it away"
    must_not: "be found off the page, or be seen by Merope for the first time on the shelf"
  ITM-003:
    name: "the remaining belongings / the shelf"
    introduced: "ch.4"
    source: "scene-packets/chapter-04.md"
    last_verified: "2026-09-22"
    status: drafted
    renumbered_from: "ITM-002"
    description: "objects from many different places, none from here, none recent, none claimed, laid out with care - the way you arrange things you are keeping for someone who is coming back"
    count: "41 (CHR-002 counts it twice in ch.4 and gets the same number)"
    placed_by: "COL-001, not by any visitor and not by CHR-002. Ch.4 is explicit: 'they put them out, somebody put them out with the rest'"
    must_not: "be described with the word 'kept'; use 'laid out with care'. No VISITOR remains, ever (narrowed 2026-09-22 under CONF-005)"

  ITM-004:
    name: "the buried strap-end (the ch.3 'curve')"
    introduced: "ch.3"
    identified: "ch.5"
    found_by: "CHR-002"
    source: "chapter-03.md (as 'a shape in the growth' / 'a curve'); chapter-05.md (identified)"
    last_verified: "2026-09-22"
    description: "half in and half out of the growth, one long smooth bend about as long as a forearm, hard the way a bench is hard and the wrong colour for anything that grows. It has no grain and does not branch. Ch.5 identifies it: the end of a strap, with a buckle, or the shape of one grown over and kept - buried slowly, from every side, the way weather covers a fence post."
    evidence_value: "the book's only physical evidence of the buried past, and the object that makes ch.5's reveal demonstrable rather than asserted. Ch.3 carries the CRIT-003 dismissal beat; ch.5 is where Merope goes back and looks properly."
    must_not: "be identified before ch.5. In ch.3 it is 'a curve' and Merope never learns better in that chapter."
    added: "2026-09-22 - the Phase 5.6 audit found it had no entity ID at all (CONT-009), which is the same gap that left CRIT-003 nothing to check against."

