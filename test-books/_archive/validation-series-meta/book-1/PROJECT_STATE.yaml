genesis_score:
  current_floor: 7.7
  weakest_lens: "pacing_coherence (7.0)"
  strongest_lens: "prose_voice (8.5)"
  independence_warning: "SELF-ASSESSED by the agent that drafted the prose. Stated as low-independence in artifacts/06-scorecard.md. The reasoning is the evidence; the number is a summary of it."
  dimensions:
    originality: { score: 8.0, evidence: "hospitality as the mechanism; no antagonist; a collective that cannot explain because it does not know. Docked: the two-girls-and-a-vehicle frame is a known light-novel shape and 'the ground is the dead' is a well-worn horror move.", last_updated: "2026-09-22" }
    theme: { score: 8.5, evidence: "the question is never answered and the ending implicates the narrator - she is the evidence, not the exception. Docked: one point of dilution, the theme is restated in Merope's own voice twice.", last_updated: "2026-09-22" }
    characters: { score: 7.5, evidence: "Merope is specific and consistently unpleasant across 15.5k words; Achird's flatness-as-attention and her counting are characterisation through action. Docked: Achird has no interior access by design and the cast is two.", last_updated: "2026-09-22" }
    prose_voice: { score: 8.5, evidence: "the voice holds across seven chapters and three structural modes without drifting. Docked: ch.3 and ch.5 lean on the narrator's self-commentary to carry length.", last_updated: "2026-09-22" }
    pacing_coherence: { score: 7.0, evidence: "one identifiable cause - ch.3 is deliberately flat and the stretch persona abandons there; movement II is three chapters in the same shape; ch.5's reverse order makes a casual reader re-read its first paragraph. Coherence high: both CRITICALs found by 5.6 were fixed and no surviving contradiction is known.", last_updated: "2026-09-22" }
    emotion: { score: 7.5, evidence: "two quiet moments land hard (the shelf line; two fingers on a hand) and the hostile persona converted on the first. Docked: the middle is deliberately affect-flat and the ending's payoff is small by construction.", last_updated: "2026-09-22" }
    dimension_7: { name: "Worldbuilding", score: 7.0, evidence: "purpose-built and rigorously consistent, but thin by rule - no names, no history, no second location. R-008 is right for the book and costly for the score.", last_updated: "2026-09-22" }

commercial_viability:
  cvi_launch: 4.5
  cvi_legacy: 6.5
  engagement_type:
    primary: "empathy - the reader buys the narrator's voice"
    secondary: "fascination - the reveal and its structure"
    tertiary: "intellectual - the unanswered question"
  commercial_pacing: 5.0
  tomorrow_test_anchors: 4
  casual_reader_verdict: 1            # 1 = finishes
  shareability: { quote: 4, plot: 2, emotional: 3 }
  concept_pitch: "Two girls land on a planet that is delighted to see them. It feeds them, it keeps them comfortable, it asks them for nothing, and everyone who ever arrived here is dead and did not notice either."
  human_closeness: "High, with one exception that was found and removed: the single pipeline-smelling sentence was the only moment the prose read as assembled rather than felt."
  launch_problem: >-
    The book cannot be sold on premise to the genre that would most reliably buy it. The
    horror-adjacent reader ABANDONS AT CH.3 (verified in the Phase 4 simulation) and the light-novel
    reader does not habitually buy horror endings. DO NOT MARKET THIS TO HORROR READERS - the
    Annihilation promise produces DNFs. The pitch that works is the light-novel/literary-SF one.
  legacy_strength: >-
    The book rewards RETROACTIVE VERIFICATION: the hostile persona's conversion was completed by going
    back to ch.2 and finding the reveal's receipt. That is the behaviour that produces word-of-mouth in
    a niche.
  last_updated: "2026-09-22"

