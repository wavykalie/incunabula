notes: >-
  BOOK 1 IS COMPLETE (2026-09-22). All seven chapters drafted, then audited, scored and packaged.
  15,531 words against a 15,000-18,000 target. Every chapter passes tools/deslop-check.sh when run on its own, and the
  three-control validation is green. Chapter word counts: 2,402 / 2,321 / 2,354 / 2,102 / 2,077 /
  2,101 / 2,186. The gate fired on six of the seven first passes and every failure was fixed
  mechanically - rewriting genuine rule-of-three triads, one negative litany (ch.4, A18), anaphora
  on 'there was' and 'I said', and writing the missing length instead of cutting the target. No cap
  was loosened.

  ALL TEN CONFLICTS ARE RESOLVED. CONF-003 (the beings' answer boundary) was settled while drafting
  ch.2, and CONF-004 (the sleigh-and-steed mechanism) while drafting ch.7. The ledger holds both
  resolutions and the values they beat.

  WHAT THE RUN FOUND, AND IT IS THE POINT OF THE WHOLE EXERCISE: Phase 5.6 had never run, and running
  it found 2 CRITICAL defects in prose that had already passed the prose gate on ALL SEVEN chapters.
  The scanner checks sentence shape, adverb density, anaphora and negative litany. It cannot check
  whether a character was in the room. A manuscript can be 7-for-7 and still assert an act no chapter
  shows. That is now recorded as the project's central lesson.

  PHASES THAT RAN LATE AND ARE RECORDED AS LATE, not backdated: 2.8 (after ch.1), the maintenance
  layer (never instantiated until Phase 3), 1.5 (never run at all, and it was BLOCKING Phase 4), and
  the voice bank (4 of 10 until after drafting, now 10 of 10). The pattern is consistent and is
  reported as a pattern: this pipeline under-runs its own preconditions and does not notice until
  something downstream is blocked.

  TITLES REMAIN DEFERRED BY DECISION, and the manifest carries that deferral rather than filling it
  in. The EPUB is a WORKING-TITLE validation build with no invented title, no invented author and no
  invented physical description. Open story questions: the exact number of days (the SCALE is weeks,
  by prose), and whether anything else is alive on the planet.

  Phase 2.8 ran LATE - after ch.1, not before it - and was then cleared. CRIT-004 (an unparseable
  primary state file) was a defect and was repaired; CRIT-001, CRIT-002 and CRIT-003 were applied.
