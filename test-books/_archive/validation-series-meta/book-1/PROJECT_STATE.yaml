project:
  title: "(untitled — not decided)"
  series: "(series name not decided)"
  series_id: "(not decided)"
  installment: 1
  genre: "science fiction"
  subgenre: "quiet exploration SF with a hospitality-horror turn"
  target_audience: "(OPEN)"
  positioning: "short novel / serial installment"
  output_form: "manuscript chapters under manuscript/chapters/"
  formatted_pages_target: 60
  target_range_words: [15000, 18000]
  target_floor_words: 12000
  target_ceiling_words: 20000
  chapter_count_planned: 7
  average_words_per_chapter_planned: 2450
  language: "en"
  market: "English-language e-book, serial-friendly"
  device: "three-movement travelogue; the hazard is the welcome itself, not an antagonist"
  pov_strategy: "first person, single POV (Merope), past tense and retrospective, with present-tense asides for her opinion of the event. SETTLED 2026-09-22 against INTAKE.md's 'present tense' - see CONF-001"
  narrator_distance: "close and self-interested; the narrator is a character with an agenda, addressing the reader directly"
  content_boundaries:
    - "On-page violence, dread, and body horror permitted when the scene needs them."
    - "Merope and Achird are adults (19). Intimacy may be on-page when the scene requires it; explicit sexual content stays off the page."
  comp_titles: []  # proposals only — see artifacts/01-market-map.md; none approved
  created: "2026-09-22"
  updated: "2026-09-22"
  tone_balance: "partly escalatory - movement I genuinely warm; dread enters late in I and rises steadily through II and III; dread never announces itself"
  structural_decisions:
    - "A - the world was expecting them; the welcome is arranged in advance, routine and old"
    - "B - Achird finds the belongings first and is not believed; the middle of the book is her unable to be heard"
    - "C - no host, no confrontation, no chase; no being ever explains anything"
  vehicle: "NOT a chariot; no horse. An old-style sleigh (glazed enclosed cabin on runners) whose steed is drawn from a constellation and morphs into that constellation's shape. Achird owns and pilots it; Merope narrates as if she were the pilot. It is its own character and will act on its own to save someone."
  references:
    - { id: "A", work: "Wandering Witch: The Journey of Elaina", source: "3 epubs, vols 1/2/5", governs: "POV and register", read: "vol 1 ch1, vol 5 ch4+ch8, full title lists for all 3 vols" }
    - { id: "B", work: "Twinstar Cyclone Runaway (Issui Ogawa)", source: "fatbeachball.neocities.org", governs: "tone, texture, the two-girl dynamic", read: "prologue + chs 1-2" }
    - { id: "C", work: "Shoujo Seikan Hyouryuuki", source: "mangafire link (read via MangaDex public API)", governs: "format - one conceit per episode", read: "chapter 1 in full, 44 pages" }
  reference_notes: "references/tone-references.md"

