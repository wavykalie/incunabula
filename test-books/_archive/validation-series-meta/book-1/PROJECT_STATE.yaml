standing_rules:
  prose:
    instruction: "User, 2026-09-22: use the humanizer, never use signs of AI writing, and run a deslopifyer to see if it passes."
    applies_to: "every drafted chapter; a chapter is not drafted until the scan PASSES"
    ruleset_skills: ["skills/humanizer", ".agents/skills/deslopify (github.com/glaforge/deslopify, grounded in tropes.fyi)"]
    scanner: "tools/deslop-check.sh"
    pass_criterion: "exit 0; a FAIL blocks the chapter regardless of how well it reads"
    scanner_limits: "mechanical patterns only - cannot see voice, rhythm, dead metaphor, or one-point dilution; P2 duplicate-sentence check false-positives on deliberate refrains"
    calibration:
      status: "thresholds measured from published prose, not guessed"
      corpus: "Wandering Witch: The Journey of Elaina vols 1/2/5 (Yen Press) - 48 narrative docs, 175,144 words; Coldbrook Junction chs 1-11 as native-English control"
      policy: "zero-tolerance only if the phrase has 0 hits in the corpus; everything published prose actually does is density-capped above the worst calibration document"
      evidence: "tools/calibration/CALIBRATION.md, tools/calibration/calibration-report.txt"
      validation: "Elaina 51 files: 0 failing rows; slop fixture FAIL (17 rows); Coldbrook Junction 9/11 FAIL. Runner: tools/validate-controls.sh (exits nonzero on a misbehaving control or a zero-file scan)"
      empty_scan: "a directory target expanding to zero files is a FAILURE, not a pass - the earlier vacuous Elaina pass came from exactly this"
    pipeline_gate: "required at pipeline Phases 3 (Drafting), 4 (Adversarial Audit), 6 (Final Score), 7 (Editorial Package) - see skills/book-genesis references/scoring/prose-gate.md; a chapter, score, or package does not advance while the gate fails"
    pipeline_gate_note: "caps are tuned to light-novel narrative register and are looser than native-English KDP prose would justify by design"
    exempt: "PROJECT_STATE.yaml, ASSUMPTIONS.md, RUN_REPORT.md, artifacts/, scene-packets/ - engineering documents, not gated on the scan"

