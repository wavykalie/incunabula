  - { date: "2026-09-22", decision: "AUTH-1 CLOSED: ch.6's cruelty line was rewritten from 30 words in a single triple-clause to two clipped sentences of 20 words. The contract won, and the reason is arithmetic rather than taste - the speech budget asks for the SHORTEST thing Merope says, and the draft had given her the LONGEST. The change is a RELOCATION, not a cut: the relationship duration that left the dialogue is already in the narration immediately after, so the swelling now sits after the blow as well as before it. ch.6 re-gated PASS, 2,101 -> 2,089 words.", rationale: "User instruction to close the two escalated prose items. This is the only finding in the project that a CONTRACT caught rather than a reader, and the machine-readable speech budget is why.", phase: "4" }
  - { date: "2026-09-22", decision: "AUTH-2 CLOSED AS LEFT REMOVED, and the justification changed from preference to impossibility. The shelf is in the camp, out past the far edge of the growth and over a rise (ch.4), and ch.6 holds Achird physically in place throughout the confrontation, so she never leaves the clearing and returns. The act could not have occurred when ch.7 asserted it ('she had JUST done the thing'). Showing it in ch.6 as originally proposed would have required the shelf to be in the clearing.", rationale: "User instruction offered restore-or-remove. Investigating the restore option produced a stronger answer than the original finding: the clause was not merely unsupported, it was impossible. Recorded so the beat can be planned properly at Phase 2 if it is wanted - as Achird going up to the camp alone BEFORE the confrontation, not as a sentence patched into the departure.", phase: "4" }

  - { date: "2026-09-22", decision: "AUTH-5 CLOSED: both leads' physical appearance is AUTHOR-DECIDED CANON. Merope - white hair in twin tails, a celestial-themed Lolita dress, busty/full-figured. Achird - flat-chested, crimson hair in a scorpion-tail braid, a hoodie designed after nuclear superbubbles. Recorded in ENTITY_STATE.appearance and as two ledger facts at series scope; the cover brief's BLOCKING constraint is lifted and rewritten as a two-cover choice.", rationale: "User decision, given directly. FOUR parts were left OPEN rather than inferred at the time: APPEAR-1 the word 'boasty' not guessed at, APPEAR-2 the hair SHAPE undecided, APPEAR-3 the Scorpius resonance raised rather than decided, APPEAR-4 the superbubble reading flagged as this run's reading. A guess in a design brief becomes a drawing and a drawing becomes canon.", phase: "7" }
  - { date: "2026-09-22", decision: "THE THREE OPEN APPEARANCE FLAGS ARE CLOSED BY AUTHOR DECISION, and none of them changed a word of prose. APPEAR-1 'boasty' = BUSTY / FULL-FIGURED, a stated deliberate contrast with Achird. APPEAR-2 = a SCORPION-TAIL BRAID, one long crimson tail curving like a scorpion's tail. APPEAR-3 = the braid and ch.7's Scorpius are a COINCIDENCE THE AUTHOR LIKES, explicitly NOT a designed resonance.", rationale: "APPEAR-3 is recorded with three consequences rather than one sentence, because 'coincidence' is not self-enforcing and would otherwise drift: (1) NOT seeded into Book 2's design language, (2) NEVER remarked on in either book by anyone, (3) the hair and the ch.7 ending NOT changed to avoid the read. A reader who connects them is over-reading, which is the intended outcome. APPEAR-4, the superbubble hoodie, is the only appearance item still resting on this pipeline's interpretation rather than an author statement; the phrase is unambiguous in astronomy, so it is low-risk and left as-is.", phase: "7", supersedes_note: "The earlier AUTH-5 entry recorded Merope as 'not flat-chested' and listed APPEAR-1/2/3 as open. Both were accurate when written and are superseded here, not erased." }
  - { date: "2026-09-22", decision: "RECORDED, and it stays a decision rather than becoming an oversight: the manuscript describes NEITHER lead physically, anywhere, in 15,531 words. Verified by grep across all seven chapters for hair, hoodie, dress, cloak, chest, height and colour - the only hits are incidental ('moved it a hair to the left', 'not short of material', 'dress it up').", rationale: "Surfaced by the grep run that checked the new appearance facts against the prose before recording them. With appearance now canon this is a POSITION: canon for illustration and packaging, silent in the prose. It also helps the cover-the-name test pass. Making the prose describe them would be a change to the narrator contract and needs its own decision.", phase: "7" }

