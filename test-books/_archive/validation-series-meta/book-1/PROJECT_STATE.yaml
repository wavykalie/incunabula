    - { phase: "7", status: "completed", date: "2026-09-22", notes: "Editorial package written and the validation build produced. Two synopses, a blurb, a cover brief that refuses to invent either lead's appearance, and a formatting package against the 60-page/15,000-18,000-word contract (MET). EPUB 3 built from the markdown with the standard library only: dist/merope-book-one_WORKING-TITLE.epub. WORKING TITLE by author decision - no title was invented. Files: artifacts/07-editorial-package.md, tools/build-epub.py." }

