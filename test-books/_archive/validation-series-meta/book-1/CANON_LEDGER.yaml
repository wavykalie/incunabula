  CONF-001:
    subject: "book-1.pov-tense"
    values_kept:
      - { value: "present tense", source: "INTAKE.md -> Voices, Form", authority: "user_decision" }
      - { value: "retrospective past tense with present-tense asides", source: "foundation.md, PROJECT_STATE.yaml, chapter-01.md", authority: "manuscript" }
    severity: "CRITICAL"
    status: "resolved"
    resolution: "RETROSPECTIVE PAST TENSE. The intake's 'tight present tense' loses. Reasons: the retrospective frame is load-bearing for ch.7's ending and the narrator's hindsight; and the reference the intake names as governing — Elaina, on POV and register — writes past-for-event with present-for-opinion."
    resolution_source: "User instruction to resolve, 2026-09-22"
    follow_through_done: "Chapter 1's three in-transit slips normalised (Now 2,399 words, prose gate re-run: PASS). INTAKE.md corrected in place. voice-dna tense section rewritten as settled. Series ledger updated."
    cascade: "None. The alternative — present tense — would have required rewriting all of chapter 1."
    found_by: "CANON_LEDGER build, first run"

  CONF-002:
