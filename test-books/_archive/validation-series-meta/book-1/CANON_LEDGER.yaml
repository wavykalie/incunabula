      - { file: "manuscript/chapters/chapter-04.md", anchor: "lines 77-125", evidence: "the shelf items are placed and handled by COL-001, not by CHR-002", observed: "2026-09-22" }
    conflicts: []
    supersedes: ["ch.7 'She had put the objects back on the shelf' - removed 2026-09-22"]
    last_verified: "2026-09-22"
    notes: >-
      CONT-001. The removed clause asserted an act no chapter shows and assigned to CHR-002 an act ch.4
      gives to COL-001. It also undercut ch.4's payoff, where Merope is pleased by an arrangement she did
      not make. ORIGINAL WORDING PRESERVED VERBATIM: "She had put the objects back on the shelf and taken
      me by the hand for the second time in her life and walked me to a sleigh". If the intended beat was
      Achird returning Merope's things rather than taking them, it must be SHOWN rather than asserted - and
      as of 2026-09-22 it CANNOT be shown where it was said to happen. AUTH-2 CLOSED: the shelf is in the
      camp, out past the far edge of the growth and over a rise (ch.4:5, ch.4:15), and ch.6 keeps Achird
      physically in place for the whole confrontation ("She stood there." / "She said nothing."). She
      never leaves the clearing and returns, so the act could not have occurred when ch.7 said it did -
      "she had JUST done the thing". The finding is therefore not merely 'unshown' but IMPOSSIBLE, and
      leaving the clause removed is the correct resolution rather than the cautious one. If the beat is
      wanted it belongs in an EARLIER scene - Achird going up to the camp alone and retrieving Merope's
      things before the confrontation - which is Phase 2 work to be planned and placed, not a sentence to
      be patched into a departure.

