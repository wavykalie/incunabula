    follow_through_done: "chapter-05.md :48, :62, :69; chapter-06.md :57; chapter-07.md :52 all corrected. ENTITY_STATE CHR-002.speech_budget added. voice-dna consistent."
    cascade: "Checked: ch.6's required 'one sentence, plus at most one word' and its opening line now agree with its own continuity block instead of contradicting it."
    found_by: "Phase 2.8 continuity audit"

  CONF-003:
    subject: "beings.answer-boundary"
    values_kept:
      - { value: "they cannot lie; they answer honestly and immediately", source: "foundation.md, voice-dna.md", authority: "user_decision" }
      - { value: "no being ever explains, warns, hints or states the truth — not once, to anyone", source: "foundation.md writer warning 10", authority: "user_decision" }
    severity: "WARNING"
    status: "resolved"
    resolution: "A being may answer only from POSSESSION and PRESENT TENSE - what a thing is called here, where it goes, that it is good - and never from ORIGIN or OWNERSHIP. It answers immediately, cheerfully and truthfully, and the answer is empty of the dead."
    resolution_source: "Agent determination while drafting ch.2, 2026-09-22. This is the schema's proposed boundary applied rather than proposed again; the user's ch.2 packet requires a being to be asked directly and to answer with no pause before and no reaction after."
    follow_through_done: "chapter-02.md: a being is asked what the object is and whose it is, and answers 'That is a good one' / 'Not ours' / that it goes on the shelf, and moves on to being glad. chapter-01.md's 'Somebody lost this' is Achird, not a being, and stays on the right side of the line."
    cascade: "Verified across ch.1-7: no being states origin, ownership, cause or the dead. The ch.5 being that says 'To be ready' answers from present-tense purpose, not origin."
    found_by: "Phase 2.8 continuity audit"

