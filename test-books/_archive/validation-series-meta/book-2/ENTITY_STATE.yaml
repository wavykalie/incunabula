# ENTITY_STATE.yaml - BOOK 2
#
# Loaded from ../book-1/ENTITY_STATE.yaml on 2026-09-22. Entities are NOT re-created: the IDs are
# series-stable, and a character gains facts, never a new ID.

meta:
  built: "2026-09-22"
  updated: "2026-09-24"
  mode: "INHERIT + ISSUE + UPDATE (new entities issued 2026-09-24; UPDATE pass over the seven drafted chapters run 2026-09-24)"
  scope: "book-2"
  inherited_from: "../book-1/ENTITY_STATE.yaml"
  id_policy: "stable across the series; Book 2 appends facts to existing IDs and issues NEW ids only for genuinely new entities"
  next_free_ids:
    note: "Book 2 must continue each sequence rather than restart it, so that a Book 3 can never collide with a Book 2 entity. The ids below are free AFTER the allocations in new_in_book_2."
    characters: "CHR-003"
    items: "ITM-006 (ITM-001 button, ITM-002 face-stone, ITM-003 shelf, ITM-004 buried strap-end, ITM-005 the held tool)"
    locations: "LOC-007 (LOC-005 is retired, merged into LOC-004; LOC-006 is allocated to Book 2)"
    collectives: "COL-003 (COL-002 is allocated to Book 2)"

# ---------------------------------------------------------------------------- inherited entities
# Full records live in ../book-1/ENTITY_STATE.yaml. These are the carry-forward fields only; anything
# not listed here must be read from Book 1 rather than assumed.

inherited:
  CHR-001:
    name: "Merope"
    carries: "identity, voice card, age 19, the tsundere deflection, the wilfully unreliable narration of her own piloting, and APPEARANCE (series-stable as of 2026-09-22): white hair in twin tails, a celestial-themed Lolita dress, not flat-chested"
    book_2_delta: "SHE TESTS. AUTHOR DECISION 2026-09-24 (CANON_LEDGER.yaml -> facts.book-2.relationship-delta). The NOTICING is already spent: Book 1's ch.7 ends with her realising Achird loves her, so Book 2 must not re-run it (outline-audit CRIT-101). What is new is that she cannot leave it alone - she probes at it in behaviour rather than dialogue, escalates, and stops in ch.6."
    must_not: "become likable; become a reliable narrator"
    must_not_note: >-
      The third entry here used to read 'state her own feeling plainly (series-scoped voice contract)'.
      STRUCK 2026-09-24 as pipeline inference - the author never made that rule (CONF-011). Her voice
      card's 'what she never does' line in ../book-1/voice-dna.md is a Book 1 craft note, not a series
      prohibition on Book 2. What she DOES in Book 2 is now guided by book_2_delta above, and whether a
      plain sentence is ever said is a drafting decision.
  CHR-002:
    name: "Achird"
    carries: "identity, voice card, flatness-as-attention, the counting, escalation by reduction (quieter, then silent), she owns and pilots the sleigh, and APPEARANCE (series-stable as of 2026-09-22): flat-chested, crimson scorpion-like hair, a hoodie designed after nuclear superbubbles"
    book_2_delta: "She does not move first. Her voice card is author-given and stands: clipped, attending, two to four words, no modifiers. The earlier note here ('a relationship that becomes direct stops being this relationship') was editorial framing, not canon, and is removed."
    must_not: "be given long speeches; be given a second line where one sentence does the work; explain Merope's feelings to her"
  COL-001:
    name: "the beings"
    carries: "collective, cannot lie, cannot explain, never sinister, no individual is ever their spokesperson"
    book_2_delta: "DECIDED 2026-09-24: THEY DO NOT APPEAR IN BOOK 2. The author chose a NEW population, and this collective stays book-1-scoped. Its rules are not inherited by the new collective, and it must not be repurposed as Book 2's local population."
    must_not: "be replaced by a single host figure with a spokesperson's role (see CANON_LEDGER.yaml -> conflicts.PROBE-001, now RESOLVED - the no-host rule is the one that stands)"
  OBJ-001:
    name: "the sleigh"
    carries: "Achird's; a constellation as both the road and the shape; Merope narrates as though she were piloting; it acts autonomously and is its own character"
    book_2_delta: "nothing registered. It was parked at the end of Book 1 and is the only continuous presence between installments."
    must_not: "become convenient; be downgraded to a conveyance; be explained"

# ---------------------------------------------------------------------------- new in book 2
# Issued 2026-09-24. The author decided the CATEGORY of the population ("something new") and that the
# world is the location already recorded as book-2.location. The concrete design below is the
# PIPELINE'S, and is marked as such rather than dressed up as an author statement - see
# continuity/provenance-audit.md for why that distinction is written down explicitly.

new_in_book_2:
  LOC-006:
    name: "the work"
    kind: "location"
    status: "proposed - pending author sign-off"
    authority: "model_inference, on a user_decision category"
    summary: >-
      One enormous work, tended by everyone who lives there, load-bearing and constant, with no plan to
      finish and no one who holds the whole of it. Nobody says what it is for. Not because the answer is
      secret - because 'what for' is not a question the work has ever needed answered.
    rules: ["R-013", "R-014", "R-017", "R-018", "R-019"]
    naming: "never named on the page, per the unchanged series naming rule"

  COL-002:
    name: "the workers"
    kind: "collective"
    status: "proposed - pending author sign-off"
    authority: "model_inference, on a user_decision category"
    summary: >-
      The people of the work. Each was given one part of it and has been at that part long enough that
      the part is all of them. They are warm, competent and content. They can describe their own part
      endlessly and cannot describe the whole, because no one holds the whole.
    unlike_COL-001: >-
      They are NOT the Book 1 beings and do not inherit their rules. The beings could not explain; the
      workers explain constantly and it changes nothing, because the explanation never reaches WHY. The
      beings did not know what they were; the workers know exactly what they are - a function - and are
      not troubled by it.
    welcome: "their welcome is procedural: they find out what a newcomer can hold, and give it to them"
    cruelty: "none is intended and none is performed. They are kind. They do not persuade, and if Merope leaves they adjust."
    speech: "plain, unhedged, procedural, generous. No subtext, no hinting, no warning. They answer the question they were asked and return to work."

  ITM-005:
    name: "the held tool"
    kind: "item"
    status: "proposed - pending author sign-off"
    authority: "model_inference, on a user_decision category"
    summary: >-
      What Merope is handed in chapter 1. What it is for is never explained because nobody explains the
      work; what is required of her is that it be held, by her, for as long as the work needs it - which
      is forever. It does not need HER; it needs the tool held, and she was the one standing there.
    note: "This is the physical carrier of the theme question. Do not name it and do not explain it."

# ------------------------------------------------------------------------------ book-2 knowledge
knowledge_state:
  note: "UPDATE pass run 2026-09-24 over the seven drafted chapters. Per-chapter, because Book 2 starts after a gap and Book 1's end state is not a starting state."
  at_book_2_open:
    CHR-001: ["she knows Achird loves her - the noticing is already spent (Book 1 ch.7)", "she does not know what the work is for, and is never told"]
    CHR-002: ["she knows Merope knows. She does not say anything about it, and does not move first."]
    COL-002: ["do not know Merope, and do not want to"]
  chapter_by_chapter:
    ch_1: { CHR-001: "arrives; handed ITM-005 within four minutes and reads it as vindication; looks for whoever is in charge and there is no one; notices nobody looked up and narrates over it; seeds the delta by noticing nobody asked Achird for anything", CHR-002: "asked for nothing, offers nothing, watches" }
    ch_2: { CHR-001: "learns the catalogue of parts; is told the work cannot explain consequence because it has never stopped; tests Achird lightly and does not use the answer", CHR-002: "three words and a half; 'Somebody should watch it.'" }
    ch_3: { CHR-001: "hears three worker accounts; is asked 'what did you leave' and answers wrongly and confidently; begins narrating the work to herself for no audience; leaves an opening for Achird and narrates over the wait", CHR-002: "sees the leaving first and says nothing about it" }
    ch_4: { CHR-001: "watches a worker leave and is angry at her, then afraid of the anger; works harder; asks Achird three questions in a row and is answered literally", CHR-002: "'You didn't.' - answers the actual question" }
    ch_5: { CHR-001: "assembles the pattern from the man's account and then applies it to everyone except herself, aloud, at length; sleeps well", CHR-002: "'All right,' and then never mentions it again" }
    ch_6: { CHR-001: "tests concretely (the walk-off, the sleigh question); says she is staying; says the short true cruel line; says they are going; does not put the tool down", CHR-002: "one sentence: 'Then I'll take a part.' and waits for her to finish" }
    ch_7: { CHR-001: "gives ITM-005 back; is told the rows will be poorer and does not pay it; says the plain thing ('I know'); does not need it returned", CHR-002: "'The join holds.' - three words, and does not say the plain thing back" }
  open_gap_decision: "CLOSED 2026-09-24 - the interval is NOT LOAD-BEARING and is not specified. Book 1's on-planet 'weeks' scale stays book-1-scoped and must not be reused to imply a gap. See CANON_LEDGER.yaml -> facts.book-2.interval."

achird_speech_budget:
  note: >-
    BOOK 2'S OWN, issued 2026-09-24 - NOT inherited from Book 1's ch.1-7 timeline (outline-audit
    CRIT-102). She is never mute in Book 2 and there is no silence chapter.
  ch_1: "one line, two words"
  ch_2: "four short lines, all two to five words"
  ch_3: "one line"
  ch_4: "two lines, one of them four words"
  ch_5: "one line, two words"
  ch_6: "ONE SENTENCE, five words - her largest moment in the book"
  ch_7: "one line, three words. QUIET, not silent: she does not say the plain thing back"

# ----------------------------------------------------------------------------------- timeline
timeline:
  - id: "B2-T-000"
    when: "between the books"
    event: "AN INTERVAL THE BOOK DOES NOT DATE. The sleigh left a world that was glad to see it go. How long ago is deliberately not established and no beat depends on it (author decision 2026-09-24)."
    status: "resolved - not load-bearing"
  - { id: "B2-T-001", when: "day 1", event: "They land on the work. Merope is handed ITM-005 within four minutes. Nobody looks up.", source: "chapter-01.md" }
  - { id: "B2-T-002", when: "days 3-4", event: "The shift repeats. Three worker accounts, including the plain question 'what did you leave?'", source: "chapter-03.md" }
  - { id: "B2-T-003", when: "days 4-6", event: "The woman at the turn walks out. The turn is covered before the hour is out. 'We'll be poorer.'", source: "chapter-04.md" }
  - { id: "B2-T-004", when: "days 6-7", event: "The account of the woman who left is told backwards. Merope assembles the pattern and exempts herself from it, aloud.", source: "chapter-05.md" }
  - { id: "B2-T-005", when: "around day 10-11", event: "Merope says she is staying. Achird answers with five words. The cruel true line. Merope says they are going.", source: "chapter-06.md" }
  - { id: "B2-T-006", when: "day 11-12", event: "ITM-005 is returned to the low place in the ground. 'I know.' They leave. Nobody comes to see them off.", source: "chapter-07.md" }
  - { id: "B2-T-007", when: "book 2 close", event: "Merope holds the tool eleven days in total.", source: "chapter-07.md", status: "cross-chapter count, verified" }

# ------------------------------------------------------------------------------------ rules
# No new world rules yet. The series rules R-001..R-012 from ../book-1/ENTITY_STATE.yaml apply and are
# NOT restated here. Book 2's engine will add rules of its own, issued as R-013 onward once chosen.

world_rules:
  series_rules_apply: "../book-1/ENTITY_STATE.yaml -> world_rules (R-001..R-012). The naming rule, the no-host rule, the no-chase rule and the exclusion rule are SERIES-scoped and unchanged in Book 2."
  new_rules:
    - id: "R-013"
      rule: "The work does not stop. It is load-bearing and constant, and it is being done at every hour by everyone who lives there."
      status: "proposed"
    - id: "R-014"
      rule: "Nobody knows what happens if the work stops, because it has never stopped. This is not a threat and no character ever frames it as one; it is simply the one thing nobody has tried."
      status: "proposed"
    - id: "R-015"
      rule: "Everyone is needed; nobody is kept. Leaving is physically possible and openly unopposed. No one argues, persuades, blocks, or blames. Leaving is nonetheless a real loss to everyone left, who take up the slack quietly and are permanently poorer for it."
      status: "proposed"
    - id: "R-016"
      rule: "The workers remember arriving, and describe it as the day they were given their part. Everything before that has no claim on them and is not discussed."
      status: "proposed"
    - id: "R-017"
      rule: "The work is not behind schedule, and there is no plan to finish it. It is not 'unfinished' the way a task is unfinished. It is the shape the world has. No lifetime present will see its end."
      status: "proposed"
    - id: "R-018"
      rule: "No one directs the work. There is no leader, no foreman, no host, and no spokesperson. Work continues because everyone does their part. (Preserves the series no-host rule.)"
      status: "proposed"
    - id: "R-019"
      rule: "The workers are not sinister and not innocent. They are content, warm and complete, and they will answer any question about the work. 'Why does it matter' has no purchase on them and is answered by returning to the work."
      status: "proposed"
    - id: "R-020"
      rule: "Nothing on this world is named, and the work is described, never named. (Preserves R-008.)"
      status: "proposed"
    - id: "R-021"
      rule: "Nothing threatens them and nobody follows them. No confrontation, no pursuit, no danger. (Preserves R-012.)"
      status: "proposed"
  note: >-
    Issued 2026-09-24 in the Phase 2 build. R-013..R-021 are the PIPELINE'S concrete design of the
    author-decided categories (engine: the work; location: the unfinished thing; population: something
    new). They are marked 'proposed' rather than 'active' because the author decided the categories and
    not the mechanics - see continuity/provenance-audit.md. The one thing they must never become is the
    excluded book's engine: this is NOT a place that takes, keeps or absorbs anyone. Nobody is kept here,
    which is the whole point.
  engine_exclusion_check: >-
    Checked against ../book-1/foundation.md -> EXCLUSION RULE. No taking, no keeping, no absorption, no
    record of the dead, no companion who pays, no damage to the relationship, no 'What the X Kept'
    title pattern. Book 2's hold is the opposite of a trap: leaving is easy, and costly, and nobody
    stops you.

