    supersedes: []
    superseded_by: []
    conflicts: []
    last_verified: "2026-09-24"
    notes: >-
      AUTHOR DECISION. Closes open decision C-4. The prose will therefore not date the gap, not count
      elapsed time between the books, and not depend on an interval for any beat. Book 1's on-planet
      'weeks' scale is untouched and remains book-1-scoped; it must not be reused to imply the gap.

  book-2.inherited.voice-contract:
    subject: "book-2"
    predicate: "inherits"
    value: "../book-1/voice-dna.md - NOT duplicated."
    kind: "style"
    status: "active"
    authority: "process"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
