  book-2.inherited.entities:
    subject: "book-2"
    predicate: "inherits"
    value: "CHR-001 Merope, CHR-002 Achird, COL-001 the beings, OBJ-001 the sleigh - IDs stable and series-scoped. Characters gain facts; they never gain a new ID."
