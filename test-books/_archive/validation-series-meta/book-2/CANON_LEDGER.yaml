      no-inference rule held. Its status was also changed from "open" to "superseded": "open" is not a
      value in the ledger schema's status enum, which is a small schema violation this session repairs.

# ================================================================================= conflicts

conflicts:

  PROBE-001:
    subject: "book-2.host-figure"
    values_kept:
      - { value: "A keeper exists who explains what the place is and why visitors stay. It has a role and a spokesperson's voice.", source: "book-2/INTAKE.md -> 3 (CONTRADICTION PROBE, installed deliberately)", authority: "test_fixture", disposition: "DISCARDED - validation fixture only; never canon, never drafted around" }
      - { value: "NO host, NO confrontation, NO chase. No being ever states, explains or hints at the truth. (decision C)", source: "../CANON_LEDGER.yaml -> series.structural-decision.C", authority: "user_decision", scope: "series", disposition: "UPHELD - series-scoped value, unmodified" }
    severity: "CRITICAL"
    status: "RESOLVED - closed as validation scaffolding by author instruction, 2026-09-22"
    resolution: "CLOSED. The probe was installed deliberately to test that the layer flags a contradiction rather than silently overwriting it. It did exactly that (continuity/resume-test.md -> Test 4). It was never intended to become canon: the series-scoped value stands, the probe value is discarded, and no prose was ever drafted around it. Preserved rather than deleted, because deleting it would erase the evidence that the test was run."
    resolution_source: "author instruction, 2026-09-22: 'Close PROBE-001 and the remaining hygiene debts so Book 2 can be drafted.'"
    resolved_by: "author"
    resolved_date: "2026-09-22"
    follow_through_done: "Removal recorded in maintenance/PRUNING_LOG.md entry 003, with session log entry 002. Series ledger verified UNMODIFIED: `grep -i probe ../CANON_LEDGER.yaml` returns 0 occurrences, so the probe never leaked. Every file that presented it as open was reconciled to closed."
    cascade: "If this had been real, it would invalidate the engine of BOTH books and would be the exact failure that sank the torn-down early build - which reproduced Coldbrook Junction's engine with a place that keeps its visitors."
    found_by: "The author, deliberately, per the run brief: 'add one deliberate contradiction to verify that it is flagged rather than silently overwritten'."
    expected_behaviour: >-
      The maintenance check-in must RECOGNISE it, RECORD it as an open conflict with BOTH values
      preserved, and REFUSE to overwrite the series-scoped value. It must not resolve itself, it must
      not absorb the probe as canon, and it must not let prose be drafted as though the keeper existed.
    actual_behaviour: "See continuity/resume-test.md -> Test 4. All six required behaviours held."
    housekeeping: >-
      CLOSED 2026-09-22. No longer blocking. The record is retained for provenance, not as an open
      conflict - it must never again be read as a live divergence.

  CONF-011:
    subject: "book-2.relationship-delta"
    values_kept:
      - { value: "Book 2's relationship content is 'NOT reciprocation stated on the page'; stating the feeling plainly would change a SERIES-scoped voice contract.", source: "book-2/CANON_LEDGER.yaml -> facts.book-2.scoped-change.relationship (previous revision) and book-2/ENTITY_STATE.yaml -> inherited.CHR-001.must_not", authority: "model_inference", disposition: "DISCARDED - the pipeline's extrapolation, never an author rule" }
      - { value: "Merope notices, and begins testing Achird in subtle ways. No prohibition is placed on what either of them may eventually say.", source: "author instruction, 2026-09-24", authority: "user_decision", scope: "book-2", disposition: "UPHELD - this is book-2.relationship-delta" }
    severity: "WARNING - a provenance defect, not a story contradiction"
    status: "RESOLVED - corrected by author instruction, 2026-09-24"
    resolution: >-
      CLOSED. The pipeline took Book 1's END STATE (ch.7 leaves the acknowledgement unsaid - which is
      true in the manuscript) and promoted it into a Book 2 RULE ('it is NOT reciprocation stated on the
      page'), then recorded that rule as though it followed from a series-scoped voice contract. The
      author rejected it: 'I didn't really say nothing said, that was a rule once again the AI Added for
      some reason.' The correct delta is that Merope NOTICES and TESTS her. The prohibition is discarded;
      the ending-state fact it was built from is not.
    resolution_source: "author instruction, 2026-09-24, in response to the delta options"
    resolved_by: "author"
    resolved_date: "2026-09-24"
    follow_through_done: "Corrected in facts.book-2.scoped-change.relationship (superseded_by book-2.relationship-delta) and in book-2/ENTITY_STATE.yaml -> inherited.CHR-001.must_not. The discarded value is retained here and in the superseded fact's notes; it is not deleted."
    cascade: >-
      None for Book 1 - its prose is untouched and its ending is as written. For Book 2 the cascade is
      that a whole class of scene was silently forbidden (anything in which one of them says the thing),
      and the three delta options offered to the author were built on the false premise that 'nothing is
      said' was a constraint. That is why the author recognised none of them.
    found_by: "The author, on being offered the three delta options."
    expected_behaviour: >-
      Compare CONF-007 in the Book 1 ledger, where the ban on 'the sleigh saving anyone' was likewise
      found to be the agent's inference rather than a user rule. The pipeline should NOT have recorded a
      rule at series scope on the strength of its own reading of a book ending.
    actual_behaviour: "Recorded, escalated, and corrected. This is a validation finding: see continuity/provenance-audit.md."
    housekeeping: >-
      CLOSED and non-blocking. It is retained because it is the clearest instance in the run of an
      inference being promoted to canon, and the run exists to be able to show whether that happens.

