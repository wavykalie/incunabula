  book-2.engine:
    subject: "book-2"
    predicate: "engine_is"
    value: "THE WORK. A world where everyone has a job and the job is the entire point. Nobody is kept; everyone is NEEDED, constantly, and usefulness here never ends. Merope - who has never been useful to anybody - is offered a role. The inversion of Book 1: nothing is asked of you / you are asked for everything. Theme: is being needed the same as being wanted?"
    kind: "world"
    status: "active"
    authority: "user_decision"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
    sources:
      - { file: "INTAKE.md", anchor: "2.1 Engine A", evidence: "one of three options written up at Phase 0, with a non-canon sample in artifacts/engine-samples.md", observed: "2026-09-22" }
      - { file: "PROJECT_STATE.yaml", anchor: "decisions (2026-09-23)", evidence: "Author selected Engine A from the three offered and re-confirmed the commercial contract with a raised ceiling.", observed: "2026-09-23" }
    supersedes: ["book-2.inherited.engine-is-open"]
    conflicts: []
    last_verified: "2026-09-23"
    notes: >-
      THE AUTHOR'S DECISION, not an inference - which is the entire reason Book 2 was blocked for two
      sessions. Three options were offered without a recommendation and A was chosen. Book 1's engine
      (hospitality) is untouched and stays book-1-scoped: the two engines are inversions of each other
      by design, and that opposition is the point of the installment. STILL OPEN under this engine:
      the location's content, and the relationship delta's content.

