    subject: "book-2"
    predicate: "has_open_decision"
    value: "THE ENGINE. Book 1's engine is hospitality - nothing is asked of you and that is how you die. Book 2 needs a different mechanism. Three proposals in INTAKE.md 2.1: 'the work', 'the audience', 'the record'. NONE SELECTED."
