    exclusion rule) live in ../CANON_LEDGER.yaml and are cited by reference. Facts recorded here are
    book-scoped or are pointers.

# ================================================================================= book 2 facts

facts:

  book-2.location:
    subject: "book-2"
    predicate: "location_is"
    value: "THE UNFINISHED THING. Everyone is building one enormous thing. Nobody says what it is for, because everybody who lives there already knows and Merope is the only one who arrived. It will not be finished in any lifetime present. Every person there is genuinely essential, which is why nobody leaves: leaving stops it. Merope is handed a tool and told the work needs it held - the need is real and impersonal."
    kind: "world"
    status: "active"
    authority: "user_decision"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
    sources:
      - { file: "artifacts/location-and-delta-options.md", anchor: "Location 3", evidence: "one of three options written up for the location decision, with a non-canon sample", observed: "2026-09-23" }
      - { file: "PROJECT_STATE.yaml", anchor: "decisions (2026-09-23)", evidence: "Author selected Location 3 from the three offered.", observed: "2026-09-23" }
    supersedes: ["book-2.scoped-change.location"]
    conflicts: []
    last_verified: "2026-09-23"
    notes: >-
      AUTHOR DECISION, from options offered without a recommendation. This satisfies the pre-registered
      scoped change "new location": the change was registered before Book 1 finished and the content is
      now chosen, so it remains LEGITIMATE and must not be flagged as a contradiction. The world's
      concrete mechanics - what the thing is, what happens when the work stops, how long anyone has been
      there - are NOT decided here: they are Phase 2 decisions issued as R-013 onward. Nothing on this
      planet is named.

  book-2.scoped-change.location:
    subject: "book-2"
    predicate: "introduces_scoped_change"
    value: "new location - RECOGNISED from ../CANON_LEDGER.yaml -> series.book-2.scoped-change. The CONTENT of the location was undecided at the resume; it is now decided and lives in book-2.location."
    kind: "plot"
    status: "superseded"
    authority: "user_decision"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
    sources:
      - { file: "../CANON_LEDGER.yaml", anchor: "series.book-2.scoped-change", evidence: "pre-registered before Book 1 was finished", observed: "2026-09-22" }
    supersedes: []
    superseded_by: ["book-2.location"]
    conflicts: []
    last_verified: "2026-09-23"
    notes: "LEGITIMATE - it is a pre-registered scoped change and must not be flagged as a contradiction of Book 1. SUPERSEDED 2026-09-23 by book-2.location, which carries the chosen content, so it no longer reads as an open question. Retained so the registry of scoped changes still shows both that it was pre-registered and that it was consumed."

  book-2.scoped-change.relationship:
    subject: "book-2"
    predicate: "introduces_scoped_change"
    value: "changed Merope/Achird relationship state - RECOGNISED from the same pre-registration. The relationship state at the END of Book 1 is manuscript fact: the acknowledgement is known and unsaid (two fingers on the back of a hand; no sentence from either). What Book 2 does with that state is the content decision, now recorded in book-2.relationship-delta."
    kind: "plot"
    status: "active"
    authority: "user_decision"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
    sources:
      - { file: "../CANON_LEDGER.yaml", anchor: "series.book-2.scoped-change", evidence: "pre-registered", observed: "2026-09-22" }
      - { file: "../book-1/manuscript/chapters/chapter-07.md", anchor: "the acknowledgement", evidence: "two fingers on the back of a hand; no sentence from either", observed: "2026-09-22" }
    supersedes: []
    superseded_by: ["book-2.relationship-delta"]
    conflicts:
      - fact_id: "book-2.relationship-delta"
        reason: "This fact previously asserted that stating the feeling plainly 'would change a SERIES-scoped voice contract'. The author rejected that assertion on 2026-09-24: it was a pipeline inference, not a user rule. See CONF-011."
        status: "resolved"
    last_verified: "2026-09-24"
    notes: >-
      CORRECTED 2026-09-24 (CONF-011). The earlier version of this fact stated that Book 2's relationship
      content 'is NOT reciprocation stated on the page' and that saying it plainly would change a
      series-scoped voice contract. That prohibition was never author-given: it was the pipeline
      extrapolating Book 1's END STATE (an acknowledgement left unsaid in ch.7) into a Book 2 RULE, and
      then recording the rule at series scope. The author caught it. Book 1's ending is a state, not a
      prohibition, and Book 2's content now lives in book-2.relationship-delta. The prohibition is
      kept below as a discarded value rather than deleted, because deleting it would erase the evidence
      that the pipeline made the inference.

  book-2.relationship-delta:
    subject: "book-2"
    predicate: "relationship_delta_is"
    value: "AWARENESS, AND TESTING. The author's instruction: Merope notices - she is more aware of Achird's feelings than she was - and she begins TESTING her in subtle ways. Nothing is announced; the testing is behaviour, not dialogue. Achird's side does not move first: her voice stays clipped and attending."
    kind: "plot"
    status: "active"
    authority: "user_decision"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
    sources:
      - { file: "INTAKE.md", anchor: "2.2 relationship delta", evidence: "author direction: more aware of each other's feelings; the concrete content is now fixed as noticing + testing", observed: "2026-09-24" }
      - { file: "PROJECT_STATE.yaml", anchor: "decisions (2026-09-24)", evidence: "Author's own words: 'Merope notices and starts testing her in subtle ways.'", observed: "2026-09-24" }
    supersedes: ["book-2.scoped-change.relationship"]
    superseded_by: []
    conflicts: []
    last_verified: "2026-09-24"
    notes: >-
      AUTHOR DECISION, 2026-09-24, given in response to the three written delta options - which the
      author declined, because the real delta is none of them and the 'nothing is said' framing that
      produced them was the pipeline's own inference. Merope's deflection does not stop being
      characterisation: what changes is that she now NOTICES the thing she used to look past, and pokes
      at it rather than ignoring it. Testing is compatible with Achird's voice card; it is NOT a licence
      to have either of them state the feeling plainly, but it is also NOT a rule that forbids doing so
      - that question is now a drafting decision, not a pre-registered prohibition. See CONF-011.

  book-2.population:
    subject: "book-2"
    predicate: "population_is"
    value: "SOMETHING NEW - neither the Book 1 beings (COL-001) nor ordinary people-with-jobs. Author decision 2026-09-24: the inhabitants are designed as Book 2 world rules, not inherited. COL-001 stays book-1-scoped and does NOT appear in Book 2."
    kind: "world"
    status: "active"
    authority: "user_decision"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
    sources:
      - { file: "PROJECT_STATE.yaml", anchor: "decisions (2026-09-24)", evidence: "author selected 'Something new' from three options for the population", observed: "2026-09-24" }
    supersedes: []
    superseded_by: []
    conflicts: []
    last_verified: "2026-09-24"
    notes: >-
      AUTHOR DECISION for the CATEGORY (a new population). The concrete design of that population is a
      Phase 2 obligation and is recorded as world rules R-013 onward in ENTITY_STATE.yaml, flagged there
      as pipeline-proposed pending author sign-off. It is NOT the Book 1 beings: COL-001's rules
      (cannot lie, cannot explain, never sinister, no spokesperson) are scoped to COL-001 and are not
      inherited by a new collective.

  book-2.interval:
    subject: "book-2"
    predicate: "interval_since_book_1_is"
    value: "NOT LOAD-BEARING. Author instruction 2026-09-24: the elapsed time between the books is not important to this universe and is not to be specified, dated or relied on. Book 2 opens after Book 1 with no fixed interval."
    kind: "plot"
    status: "active"
    authority: "user_decision"
    scope: { series_id: "validation-series", book_id: "book-2", start_book: 2, end_book: 2 }
    sources:
