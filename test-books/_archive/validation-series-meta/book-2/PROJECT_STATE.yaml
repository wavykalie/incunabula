# -------------------------------------------------------------------------------- scoped changes
series_scoped_changes:
  note: >-
    PRE-REGISTERED in ../CANON_LEDGER.yaml as series.book-2.scoped-change, before Book 1 was finished.
    These are LEGITIMATE and must NOT be flagged as contradictions. Any OTHER departure from a
    series-scoped fact IS a contradiction and must be raised.
  registered:
    - "new location"
    - "changed Merope/Achird relationship state"
  direction_of_the_relationship_delta: >-
    Book 1 ends with the acknowledgement KNOWN AND UNSAID (two fingers on the back of a hand; no
    sentence from either) - that is manuscript fact, scoped to ch.7. Book 2 opens with both of them
    aware. Awareness rising is the direction.
  content_of_the_relationship_delta: >-
    DECIDED BY THE AUTHOR 2026-09-24: MEROPE NOTICES, AND BEGINS TESTING ACHIRD IN SUBTLE WAYS.
    CORRECTED THE SAME DAY (CONF-011): an earlier version of this file recorded that stating the feeling
    plainly 'would change a series-scoped voice contract' and was therefore excluded. The author
    rejected that - it was the pipeline's inference, never a user rule. Book 1's ending is a STATE, not
    a prohibition, and nothing is pre-emptively forbidden in Book 2. Achird's side still does not move
    first: her voice card is author-given and stands. What is no longer true is that the layer decides in
    advance whether a plain sentence is allowed.
  not_registered:
    - "any host figure, spokesperson, or being that explains (PROBE-001 - deliberate contradiction test)"
    - "any chase, pursuit, or last-minute danger"
    - "naming anything on a planet"

standing_rules:
  prose:
    instruction: "INHERITED from Book 1 - humanizer rules and the tropes.fyi anti-pattern list in force; a chapter is not drafted until the scan PASSES."
    scanner: "../tools/deslop-check.sh"
    controls: "../tools/validate-controls.sh"
    calibration_evidence: "../tools/calibration/CALIBRATION.md"
    pass_criterion: "exit 0; a FAIL blocks the chapter regardless of how well it reads"
    scanner_limits: "mechanical only - cannot see voice, rhythm, dead metaphor, continuity, or one-point dilution"
    calibrated_against: "Wandering Witch vols 1/2/5 (48 narrative docs, 175,144 words) plus Coldbrook Junction as an AI-written control"
  maintenance:
    protocol: "../.agents/skills/book-genesis-codex/references/maintenance-protocol.md"
    ledger_schema: "../.agents/skills/book-genesis-codex/references/canon-ledger-schema.md"
    gate: "required at every phase - see ../.agents/skills/book-genesis/SKILL.md -> PHASE GATES"
    document_reconciliation: "../tools/check-stale-status.sh"
    document_reconciliation_rule: >-
      Run with the other checks at every phase gate and at run close. A state or planning file must not
      assert the work is unfinished while its own fields say it is done - any STALE hit is reconciled
      before the gate is called passed. Dated records (maintenance/SESSION_LOG.md, PRUNING_LOG.md,
      continuity/*.md, artifacts/*) are EXEMPT by design: they hold past and present together on purpose.
      Reconcile by correcting or clearly historicising the stale prose; log the change in
      maintenance/SESSION_LOG.md and keep the superseded wording in maintenance/PRUNING_LOG.md rather
      than erasing it (maintenance-protocol section 7).
  canon:
    authority_precedence: "explicit user decision > approved manuscript text (scoped to the chapter where true) > accepted revision or editor decision > foundation/outline as planned canon > cited research > model inference"
    no_inference_rule: "A fact is created from user consultation, not from model inference. This rule exists because the torn-down early build wrote canon without asking."
  continuity:
    outline_gate: "Phase 2.8 - pre-writing read of the outline against the canon; report in continuity/"
    manuscript_gate: "Phase 5.6 - pre-delivery read of the prose; report in continuity/"
    structure_drift_check: "../tools/check-structure-drift.sh"
    structure_drift_rule: "The structural ledger in foundation.md and outline.md must agree. It drifted once (ch.4 'spiral' in foundation.md vs 'fragmented' in outline.md) and the Phase 2.8 read did not catch it, so the check is now mechanical and re-run with the other gates rather than trusted to a read."

