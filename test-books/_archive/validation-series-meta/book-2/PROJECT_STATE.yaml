  output_form: "manuscript chapters under manuscript/chapters/"
  formatted_pages_target: 60
  target_range_words: [15000, 18000]
  target_floor_words: 12000
  target_ceiling_words: 22000
  chapter_count_planned: 7
  average_words_per_chapter_planned: 2450
  language: "en"
  market: "English-language e-book, serial-friendly"
  device: "THE WORK (Engine A) - a world where everyone has a job and the job is the entire point; nobody is kept, everyone is needed, constantly, and usefulness never ends. Merope, who has never been useful to anybody, is offered a role. SELECTED BY THE AUTHOR 2026-09-23 from the three options in INTAKE.md 2.1 (book-2.engine). Book 1's engine (hospitality) stays book-1-scoped."
