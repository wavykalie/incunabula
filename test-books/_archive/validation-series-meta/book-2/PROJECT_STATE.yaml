  status: "complete"
  next: "Nothing. Phases 1-7 have run for Book 2. What remains is the author's: sign-off on R-013..R-021, the hair-styling change, whether ch.7 should say more (CONF-011's correction did not reach the prose), the titles, and the comps. Phase 5 has still never been activated for either book."
