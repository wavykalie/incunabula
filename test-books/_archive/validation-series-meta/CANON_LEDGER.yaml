# CANON_LEDGER.yaml — SERIES SCOPE
#
# The series-level memory layer, per .agents/skills/book-genesis-codex/references/canon-ledger-schema.md
# It does not replace the manuscript, foundation, outline, voice DNA or entity tracker. It says which
# version of a fact is current, at what scope, and where it came from.
#
# AUTHORITY PRECEDENCE (schema): explicit user decision > approved manuscript text (scoped to the
# chapter where true) > accepted revision/editor decision > foundation/outline as planned canon >
# cited research > model inference.
#
# A later source does not automatically win. If two authoritative sources can both be true at
# different chapter or book scope, KEEP BOTH WITH SCOPE. If they cannot both be true, keep the
# earlier value, add the new value as a conflict, and request resolution.
#
# This file is what Book 2 loads first. Read `series_persistent_elements` and every fact with
# scope.end_book: null before drafting Book 2. Facts scoped to book-1 only are NOT series canon.

meta:
  schema_version: "1.0"
  project_id: "validation-series"
  updated: "2026-09-24"
  primary_state_file: "book-1/PROJECT_STATE.yaml"
  maintenance_run: 4
  mode: "created (run 1), RESUME (run 2), engine decided (run 3), then BOOK 2 DELIVERED (run 4) — run 4 executed Phases 1-7 for Book 2 and recorded CONF-011"
  note: >-
    The series has NO decided marketing name and NO title for either book. project_id is the
    working directory slug, not a title. Do not treat it as a title and do not invent one.

