# ---------------------------------------------------------------------- off-page
off_page_figures:
  - id: OFF-001
    canonical_name: "Solveig Havelock"
    age: 41
    role: "d. 2022, the Vell fourth chamber. Ines's partner. Nineteen years of partnership with Fabiola."
    note: >
      Not a ghost and not a device. She is in the equipment, the back room, the invoice
      history, and one nine-minute video that nobody in the book has watched in four
      years. The book's job is to make the reader want to watch it before the characters
      do. She is FUNNY on tape. That is the whole tragedy: she is funny, so the loss is of
      a specific person and not of an atmosphere.
    planned_chapters: [2,6,7,12,28,43]
    status: planned
    revised: >
      2026-09-29, ch 7. Named on the 1994 survey header as a member of the team, which
      places her in the Vell in 1994 - 28 years before the collapse - and makes her a
      colleague of both Vera Marrow and Ines Varga. A 28-year working span in the same
      system is ordinary for this trade and is why the association still has her on its
      books as somebody who could be asked.

  - id: OFF-002
    canonical_name: "Vera Marrow"
    age: 68
    role: "Ottoline's mother. Surveyed and filmed the Vell 1994-95. Made one film that was
            not the film. Stopped working in 1997."
    note: >
      Not the villain and not the answer. She is a warning with the same face as a role
      model, which is the specific thing Ottoline cannot metabolise. She appears on screens
      and down telephones only, and is NEVER in the same room as Ines. The prohibition is
      not dramatic: the two women are each what the other one would have to become, and the
      book does not think that is survivable. That remains true in the last scene.
    revised: >
      2026-09-29, during drafting of chapter 7. The 1994 survey credits are revealed on the
      page as "V. Marrow, B. Ostrowski, and S. Havelock" - which puts Vera and SOLVEIG ON
      THE SAME TEAM, 28 years before the collapse. This was not in the foundation and it
      was not planned. It is recorded here as a DRAFTING DISCOVERY rather than quietly
      absorbed, because it changes the book's central coincidence and a later session
      must be able to see that it arrived late and on purpose.
      Why it is kept: it makes the 1994 archive the SAME generation of people as the 2022
      event rather than a parallel one, which is what turns the archive from a mystery into
      a family. It also means Ines and Vera were colleagues, which is the strongest
      available reason for Ines to have read the 1994 material before ch 17 and to have
      said nothing - and it is consistent with the premise's wound on Ottoline, which
      required somebody who WAS there to have told her and not done so.
    planned_chapters: [7,17,20,21,23,44]
    status: planned

  - id: OFF-003
    canonical_name: "B. Ostrowski"
    role: "third name on the 1994 Vell survey credits. Present on the page once, in chapter
            7, as a word in a header. Never speaks, never appears again, and is not
            developed."
    note: >
      Minted in ch 7 because a three-name survey credit is what a survey credit looks like,
      and a two-name credit would have read as a private arrangement. Kept deliberately
      minor: the book is about two women and the third name is load-bearing ONLY as
      evidence that the 1994 team was a team. Do not develop. A revision pass that gives
      Ostrowski a scene is adding a character to a book that does not have room for one.
    status: planned

