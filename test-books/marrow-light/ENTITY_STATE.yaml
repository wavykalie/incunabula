# ----------------------------------------------------------------------------- objects
objects:
  - id: OBJ-001
    name: "The gauge"
    note: >
      Brass, hand-painted, nailed to the wall fifty metres inside the Vell entrance. Marked
      in hours since the last known rise. Nine appearances in the book: ch 1 (furniture,
      four words, unnoticed), 12 (in the report), 21 (in 1994 frame, legible, unremarked
      by any character), 25 (said in the middle of a paragraph about something else), 26
      (stilled and measured), 33 (the reading that breaks the book), 38 (read correctly by
      Hana, out loud, to nobody), 45 (the last line of dialogue in the novel). It is a
      number. That is the whole horror of it.
    status: planned
  - id: OBJ-002
    name: "The rack"
    note: "What Ines wears. Worn underground and not above ground. First put on for the film in ch 11; a small event. Unbearable in ch 16. A relief in ch 41, unremarked. The book never explains this and the reader is the only one keeping track."
    status: planned
  - id: OBJ-003
    name: "The line"
    note: "Fifty metres of wool between them for most of the book. Soft, which is why they can talk through it. The only technology in the book better than it should be, and the reason the romance is possible at all."
    status: planned
  - id: OBJ-004
    name: "The nine-minute video"
    note: "Solveig Havelock, back room of Renn and Daughters, on a laptop, unviewed for four years. Introduced ch 2, referred to nine times, watched in full ch 43 in front of witnesses."
    status: planned
  - id: OBJ-005
    name: "The 1994 tape"
    note: "Vera Marrow's Vell material. Beautiful. Not the film. Contains a legible gauge reading that is WRONG - worn, misread, or copied from a plate that was itself copied. Released by Marisol in ch 22. This object is the book's evidence and its misreading is the book's whole plot."
    status: planned
  - id: OBJ-006
    name: "Incident 2022/114"
    note: "The incident report. Contains the water reading and the descent count. Read aloud in ch 12. Cross-checked against the 1994 frame in ch 33. The reader is given both numbers and the book does not do the sum."
    status: planned

# ------------------------------------------------------------------------- world rules
world_rules:
  - id: WR-001
    rule: "A survey of a tight system needs two people on separate ends of a line. A PHYSICAL constraint, not a metaphor. The plot depends on it and the book lets it be physical for as long as possible before anyone in it says something about the other thing."
    enforced_in: [11, 14, 15, 19, 38, 39, 41]
  - id: WR-002
    rule: "The Vell has one entrance large enough for a person with a full rack and not large enough for two people abreast. Everyone goes in one at a time."
    enforced_in: [9, 11, 19, 39, 42]
  - id: WR-003
    rule: "The collapse was caused by WATER, not rock, and this is knowable from the start. Nothing in the book turns on the reader not knowing it. The tension is not WHAT happened - it is that four years later nobody will say the word, and the one person who was there is selling bolts eleven kilometres away. There is no last-minute doubt. Nobody says 'maybe it wasn't the water.' The doubt was in 1994 and it was wrong then too."
    enforced_in: [12, 26, 33, 38, 45]

# ------------------------------------------------------------- relationship pressure
# Built as pressure between people, not fondness, per the foundation rules.
relationships:
  - pair: [CHR-001, CHR-002]
    name: "Ines / Ottoline"
    dynamic: "A woman who will not be filmed and a woman who cannot stop filming. Every scene is a negotiation over access conducted in the register of two professionals, which is the only register either of them can survive. The romance happens in the ACCOMMODATIONS - who goes first down the rope, who holds the camera, who is standing in the rain at the wrong end of it."
    first_touch: 1
    first_honesty: 36
    note: "Nobody says anything directly until chapter 36, and when they do it is about something smaller than the truth."
  - pair: [CHR-001, CHR-005]
    name: "Ines / Tove"
    dynamic: "Professional jealousy with no villain. The same skill at different points on one curve, and neither will say so."
    first_touch: 7
    decisive: 35
  - pair: [CHR-001, CHR-003]
    name: "Ines / Fabiola"
    dynamic: "Nineteen years of a business and a grief. Fabiola is the only person Ines cannot lie to successfully, because Fabiola already knows and is waiting for the sentence rather than the fact."
    first_touch: 1
    decisive: 34
  - pair: [CHR-001, CHR-006]
    name: "Ines / Hana"
    dynamic: "The unresolved professional relationship, and the book's most patient one. Four years of Hana waiting."
    first_touch: 4
    decisive: 31
  - pair: [CHR-002, CHR-004]
    name: "Ottoline / Marisol"
    dynamic: "Teacher and student in genuine, well-meant, mutually lethal opposition. Marisol is right. Ottoline is going anyway. Neither is the villain of it."
    first_touch: 3
    decisive: 30
  - pair: [CHR-002, CHR-006]
    name: "Ottoline / Hana"
    dynamic: "The one uncomplicated thing in the book - and the chapter that establishes it is going to be taken away is chapter 29."
    first_touch: 4
    decisive: 29
  - pair: [CHR-002, CHR-005]
    name: "Ottoline / Tove"
    dynamic: "Tove is the professional Ottoline is becoming and has no patience for yet. Tove takes her seriously in chapter 24 and this is the chapter that turns the book."
    first_touch: 7
    decisive: 24

