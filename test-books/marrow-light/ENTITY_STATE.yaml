# ENTITY_STATE.yaml — Case Tracking (BUILD, Phase 2.7)
#
# Single source of truth for continuity. Built BEFORE Chapter 1 was written, from
# CANON_LEDGER.yaml + artifacts/02-story-engine.md + artifacts/03-characters.md +
# artifacts/05-outline.md.
#
# `status: planned` = known from the outline, not yet on the page.
#
# ---------------------------------------------------------------------------
# CAST DECLARATION FORMAT — inherited from muzzle-and-marrow, and load-bearing
# ---------------------------------------------------------------------------
# The frozen gate `check-names.py` reads cast from `canonical_name:` lines and splits each
# on whitespace: parts[0] is a FIRST name, parts[1] a SURNAME. Probed on the pilot:
#
#   "Duke Rocky of Cavalton"   -> first="Duke",      surname="Rocky"
#   "Mittens the 7th"          -> IGNORED (single bare part)
#
# So each character is declared twice. `canonical_name` is what the parser reads and is
# always two ordinary parts. `called_in_prose` is what the manuscript prints. They happen
# to be the same in this book — this is a contemporary romance, so the names ARE the
# names — but the two fields are kept separate because the probe result is a property of
# the PARSER, not of the pilot's world, and a future entry into this world with pet names
# in it would silently lose characters from the gate.
#
# The frozen gate is NOT modified and no prose is bent to satisfy a parser.

meta:
  mode: "BUILD (Phase 2.7), then UPDATE after each block of 5-10 chapters"
  built: "2026-09-29"
  sources: [CANON_LEDGER.yaml, artifacts/02-story-engine.md, artifacts/03-characters.md, artifacts/05-outline.md]
  last_update: "2026-09-29"
  update_note: "Initial build. No chapter drafted yet. Chapters listed are PLANNED appearances from the outline."

# --------------------------------------------------------------------------- characters
characters:
  - id: CHR-001
    canonical_name: "Ines Varga"
    called_in_prose: "Ines"
    age: 38
    role: protagonist
    profession: "cave explorer, decommissioned; sells technical equipment at Renn and Daughters"
    wound: "the 2022 Vell survey ended in a collapse in the fourth chamber; her partner Solveig Havelock died in it; Ines was fifteen metres away on the line and did not go back in"
    want: "to be asked to do something difficult by someone who is not pitiable"
    need: "to be caught - to have the true sentence held by somebody who will not put it down"
    lie: "'the cave took something from me', rather than 'I went back eleven times in nine weeks and was two chambers too deep when the water came'"
    contradiction: "the most reliable person anyone will work with, lying about the single most important thing about herself"
