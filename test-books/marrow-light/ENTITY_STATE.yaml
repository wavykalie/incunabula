    canonical_name: "Marisol Trent"
    called_in_prose: "Marisol"
    age: 45
    role: "secondary; film-school supervisor who objects to the shoot"
    wound: "was on the panel that cleared Vera Marrow's 1994 Vell permit, the last such thing she did before leaving industry for teaching. She has never seen the resulting film, because there wasn't one."
    want: "to stop Ottoline, specifically and on the record, so that when it goes wrong there is a document"
    need: "to be the person who was right"
    lie: "'this is unsafe' - true, and a hiding place. Right about every fact, and the rightness is doing work she cannot look at directly."
