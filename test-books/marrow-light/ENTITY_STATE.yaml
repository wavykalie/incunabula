    canonical_name: "Ottoline Marrow"
    called_in_prose: "Ottoline"
    age: 22
    role: protagonist
    profession: "film-school student, second year"
    wound: "her mother Vera Marrow filmed the Vell in 1994, made one film that was not the film, and stopped; nobody who was there ever told Ottoline why"
