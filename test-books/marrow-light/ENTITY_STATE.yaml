carried_threads:
  - id: THREAD-01
    name: "The eleven descents"
    owed_in: [3, 12, 27, 34, 36, 45]
    note: "Ines went back too many times. The reader is given the COUNT in ch 12 without being given the MEANING. The meaning arrives in ch 34, from a delivery date, from Fabiola."
  - id: THREAD-02
    name: "The gauge"
    owed_in: [1, 12, 21, 25, 26, 33, 38, 45]
    note: "Eight appearances. A number. The last line of the novel."
  - id: THREAD-03
    name: "The ambiguous clause"
    owed_in: [2, 22, 44]
    note: "The contract's one unclear term, about material neither party owns. Legal ambiguity in Block I, a DIFFERENT ambiguity in Block III, resolved badly in a car park in Block IV. Deliberately two ambiguities, not one recurring one."
  - id: THREAD-04
    name: "The rack"
    owed_in: [9, 11, 16, 39, 41]
    note: "Small event in ch 11. Unbearable in ch 16. Relief in ch 41, unremarked. Never explained."
  - id: THREAD-05
    name: "Ottoline filming without asking"
    owed_in: [3, 14, 20, 25, 36]
    note: "Her habit since she was fifteen. Treated by the book as a lie about consent. Chapter 36 is where she stops."
  - id: THREAD-06
    name: "Vera Marrow"
    owed_in: [17, 20, 21, 23, 44]
    note: "On screens and down telephones. Never in the same room as Ines, including in the last scene."
  - id: THREAD-07
    name: "Tove's forty-one readings"
    owed_in: [13, 24, 28, 35]
    note: "The count is specific. A person does not count about a document they are indifferent to."
  - id: THREAD-08
    name: "The nine-minute video"
    owed_in: [2, 6, 28, 43]
    note: "Introduced, referred to nine times, watched once."
