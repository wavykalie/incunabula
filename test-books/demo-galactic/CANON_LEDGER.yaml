# CANON LEDGER — Bell Tide (DEMO)
# Exists so that check-names.py can read this cast in the real shape. This is a naming
# demonstration, not a book. The prose, the architecture and the manuscript do not exist.
#
# The `name_derivation` field is the point of the file. It is where a name's reason gets
# written down so that it can be checked later — USER_PREFERENCES.md §1, "how to apply":
# give the name a reason and write the reason down. It is not a schema field any gate
# reads; it is documentation, and it lives here so the cast stays one artefact.

meta:
  project: "bell-tide-demo"
  premise: 1
  scope: "demo"
  series: "none"
  created: "2026-09-28"
  last_verified: "2026-09-28"
  authority: "premise.md §2 and artifacts/02-voice-matrix.md §2 are the sources"
  demo_not_a_book: true
  preference_applied: "USER_PREFERENCES.md §1 (naming) — advisory, one deliberate decline"

people:
  - id: "P-001"
    name: "Swithin Garrow"
    role: "protagonist — pump-keeper's grandson, 14"
    name_derivation: "St Swithin's Day, 2 July — the fen rain charm: if it rains on Swithin's day, forty days of rain follow. A saint who predicts water, for a family that works the water. Forty days is also longer than anyone waits for proof."
    lie: "That knowing something is the same as being able to show it."

  - id: "P-002"
    name: "Hesper Garrow"
    role: "grandmother, 71 — keeps the parish almanac, the last page of written numbers"
    name_derivation: "Hesper — the evening star, and the evening office in the Book of Common Prayer, which has a hymn about the sun going down. Last light in the village. Surname shared with Swithin because the root is the family's."
    lie: "That a written record is a defence."

  - id: "P-003"
    name: "Ivo Parr"
    role: "16 — fishes the drain, knows the water better than the pump does"
    name_derivation: "A parr is a young salmon: a fish that returns to the river it was born in to die. He knows the water best and he is the one who leaves."
    lie: "That knowing a place well is a reason to stay in it."

  - id: "P-004"
    name: "Anstice Coombe"
    role: "15 — wants the fen flooded; the argument that answers his"
    name_derivation: "Old English anstice — a thing that is opposite, a counterpoise, that which answers; a riddle-and-charm word, one of the oldest in the language. The deepest root in the book, given to the character whose whole function is to answer him."
    lie: "That being right about one thing entitles you to a consequence."

  - id: "P-005"
    name: "Joe Cobb"
    role: "52 — pump mechanic; the only one who tells the truth without paying for it"
    name_derivation: "NOTHING DERIVED — DELIBERATE. Cobb is a fen surname (cob = the clay the fen is cut from; Cobb is a real occupational name from fen drainage) but no meaning is attached. He could have been Wilkin Swith or Alba Garrow; both were defensible, both were wrong, because a name that means something makes a promise this character will not keep. He is the plain name in a book of loaded ones, so the reader can tell he is not part of the myth. USER_PREFERENCES.md §1 limit, applied rather than the letter obeyed."
    lie: "None. That is his function."

# check-names.py reads `people[].name`. This file is the only machine-readable cast in the
# demo. Nothing downstream consumes it — the gate is the whole audience.
