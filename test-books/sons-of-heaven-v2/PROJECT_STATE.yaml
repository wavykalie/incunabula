  scoped:
    U1: "advisory (positioning: nonfiction)"
    U4: "advisory (positioning: nonfiction)"
    U5: "advisory (positioning: nonfiction)"
  report_only: ["D1", "D2", "S1", "S2", "S3", "S4", "R1", "R2", "R3", "R4", "R5", "R6"]
