# Provenance. This is a SECOND run of the same brief. incunabula-test/ holds the first,
# 15 chapters, marked gate_passed, never observed being built. That book is the baseline
# this run is measured against, not a template to copy: the point is to watch a run
# end to end and see whether the sixteen phases hold together past chapter nine.
run:
  kind: "observed-end-to-end"
  baseline: "C:/Users/screa/incunabula/test-books/incunabula-test"
  gate_freeze: "C:/Users/screa/incunabula/GATE_FREEZE.md"
  freeze_verified: true
  note: >
    Gates were frozen and hashed before any prose was written. A gate that changes
    after this point ends the freeze for FUTURE runs only - this book stays a test
    against the manifest as recorded. Run `bash tools/prose/verify-freeze.sh` and paste
    the output into RUN_REPORT.md before trusting any gate reading below.

