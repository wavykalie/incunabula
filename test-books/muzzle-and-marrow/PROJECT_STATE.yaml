# What this book is evidence for, and what it is not.
# Stated before any revision, so a later session cannot read the numbers as
# support for something they do not support.
evidence:
  proves: >
    A book drafted from scratch under DRAFTING_FRAMEWORK.md passes the prose gate
    (exit 0, A25 at 0.00/1k with no repairs) and holds one voice end to end
    (drift exit 0).
  does_not_prove: >
    It does not show that drafting under the framework PRODUCES a chapter spread.
    It shows the opposite: CV 12.1% against a published band of 33.4-45.1%, on a
    book written with no per-chapter targets of any kind. This is the first
    from-scratch test of the framework's central claim and the claim did not hold.
    See PILOT.md.
