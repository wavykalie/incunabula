    learns_at: 22

  - id: "P-002"
    name: "Rask"
    stage_name: null
    stage_name_note: "DECLINED, and more completely than Elsa's. He has no first name in the book. Nobody says 'Mr Rask'. He is addressed by surname, alone."
    age: "late 50s"
    role: "the best Corbeau living; the only living person who has met the killer"
    source: "premise.md §8, 03-forme.md §1"
    invariants:
