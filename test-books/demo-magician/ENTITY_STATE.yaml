    age: 34
    role: "protagonist — working conjurer, and the only professional in the room with no institution behind her"
    source: "premise.md §8, 03-forme.md §1, 04-voice-matrix.md"
    invariants:
      - "She is NOT police, NOT a magistrate, NOT a relative of any victim. She has no standing in any room in Act III and is refused access twice."
      - "She carries no stage name and is never called Elsa except by Rask."
      - "Her tic: she will not describe a person in a single word. A man, not the Norwegian, not her husband. This is the name-refusal made unconsciously and the book must never point at it."
      - "She cannot prove anything by procedure. Every act of proof in the book is a personal act."
    lie: "I have nothing to perform, therefore I have nothing to be accused of."
    arc: "positive — the lie breaks in ch 22, when the test works only because she is a specific performer with a specific history"
