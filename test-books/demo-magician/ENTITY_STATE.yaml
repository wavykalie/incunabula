      - "His French is excellent. His procedural English is thin. His spelling of towns is correct; his inflection of local custom is half a beat late. THE TELL IS IN HIS SYNTAX, NOT HIS VOCABULARY."
      - "He does not enjoy the trial. He does not monologue. He is defeated by a request for leave."
    appears: "only in print, in documents, in notices, in a sentence written for the file"

# ------------------------------------------------------------------ THE METHOD

method:
  id: "M-001"
  name: null
  name_status: "NEVER NAMED ON THE PAGE. Rask says it cannot be described because describing it would be repetition, not proof. CONFIRMED by cold solve: the effect is reconstructible from planted evidence without the name."
  source: "premise.md §8, artifacts/05-cold-solve.md Part B, artifacts/07-the-test.md"
  the_trick: "The five canon effects all MOVE a thing while the audience believes it is still. The sixth never moves anything. It uses the audience being exactly right: he performs the transfer in full view, and what the room saw was true — a man was brought in and a man was taken out. The trick is that 'a man' was never a fixed quantity across the interval."
  mechanism: "The Corbeau doctrine — the audience is always right about what it saw and always wrong about what it meant — is a BLIND SPOT, not a defence. Nobody in a Corbeau school has been taught that a person is a thing that can be swapped. He does not defeat their training; he stands where it does not reach."
  evidence_left: "NONE. No apparatus, no mark, no gap, no accomplice in the moment. The room's evidence is entirely true, and it convicts them."
  why_it_works: "A retinue — the small circle who have seen it before — is the only body of people who will testify in detail about who was present. He assembles a room of people who will be confident. The assembling IS the requirement, not the hospitality."

proof:
  id: "PF-001"
  mechanism: "A falsifiable prediction. A general description cannot be wrong and proves nothing; a specific one can, and the possibility of being wrong is visible before she speaks."
  the_test: "Reiner states in advance, in open court, where a named man will say he was looking — using an inquest account sealed weeks earlier. The room confirms it."
  why_a_reciter_fails: "A reciter holds a METHOD and predicts what the method does. She predicts where a specific person in a specific chair was looking. Generality is unfalsifiable; the second is checkable against a record that predates the question."
  first_performed: "ch 22 (private, four witnesses, Reiner's room)"
  public: "ch 30 (open court, a room that does not share the vocabulary)"
  never_proves: "It does not prove murder. The trick is not a crime and never was."

# ------------------------------------------------------------------ THE TRIAL

trial:
  structure: "Act III, ch 25-31. Procedure, not melodrama. A requête, a réponse, a sentence."
  the_defeat: "ch 31 — he is required to perform it and cannot. There is no retinue; the assembly is entirely witnesses, and a witness cannot be a retinue."
  the_retreat: "ch 27 — he requests leave, cites a prior engagement, and is refused by a clerk. Paperwork defeats him."
  forbidden: "No new methods. No monologue. No courtroom thriller. The dossier, the ledger and the trial each name zero methods."

# ------------------------------------------------------------------ PLACES

places:
  - id: "PL-001"
    name: "the northern tent circuit"
    doctrine: "Austerity. Short, worklike names. A large name claims a grandeur the tent cannot support."
    source: "02-naming-the-troop.md §2"
  - id: "PL-002"
    name: "the continental salle"
    doctrine: "The grand manner. The name names an effect and is a claim that can be formally challenged. A grand name generates a paper record — the dossier."
    source: "02-naming-the-troop.md §2, 03-the-dossier.md"
  - id: "PL-003"
    name: "the southern and colonial ports"
    doctrine: "No convention, only borrowing. Names arrive wrong. He works with an audience that will not give him a Handover and abandons the grammar."
    source: "02-naming-the-troop.md §2"

# ------------------------------------------------------------------ DOCUMENT

documents:
  - id: "D-001"
    name: "the dossier"
    kind: "a performer's own bound record of their losses at a salle"
    contents: "Seven disputes, three countries, 1929-1932. He wins most and wins them well. One answer uses the wrong convention's vocabulary for the court it is in."
    load_bearing: "The dossier is the killer's interior. It is the ONLY place the reader gets him, and it names ZERO methods."
    verified_absence: "No canon effect name appears anywhere in it. Checked mechanically: all six = 0."
    source: "artifacts/03-the-dossier.md"
  - id: "D-002"
    name: "the inquest account of Aldrich"
    kind: "sealed, dated, independent — given weeks before the test"
    contents: "He says he was watching the door when the second man came in, and does not think about it again."
    load_bearing: "THE EVIDENCE PREDATES THE QUESTION. This is what makes the test sound: she is not tested on her memory, she is tested on her correspondence with a record that already existed."
    source: "artifacts/05-cold-solve.md row 29, 07-the-test.md §2.3"

