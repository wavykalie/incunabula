      - "He will not be looked at while eating. One scene is built on this and nobody comments on it."
      - "He answers ch 23 because Reiner already has the answer, not to help her."
      - "FLAT ARC. He does not soften, does not become a mentor, does not confess. What changes is that he finally answers a question he has been avoiding for forty years."
    knows_from: 1
    tells_at: 23

  - id: "P-003"
    name: "Sigrid Voll"
    stage_name: "Sigrid Voll"
    stage_name_note: "UNCHANGED. The northern tent doctrine is austerity: a large name claims a grandeur the tent cannot support."
    age: 29
    role: "northern tent performer; the corps[e]; comic relief that is not relief"
    source: "02-naming-the-troop.md §3, 03-forme.md §1"
