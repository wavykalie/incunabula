    name: "Brynjar Sigmundsson"
    stage_name: "La Furette"
    stage_name_note: "Ports. Names arrive wrong and nobody is embarrassed, because embarrassment is a luxury of the salle. He is from three places and belongs to none."
    age: 34
    role: "the ferret — sells information; the reason the fourth death happened, by not asking a question"
    source: "03-forme.md §1, 04-voice-matrix.md"
