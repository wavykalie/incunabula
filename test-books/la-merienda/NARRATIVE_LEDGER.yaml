  - { id: D-005, kind: character, description: "Nuria's twelve years of forecasts nobody argues with, and four days of writing the same figure", opened: "ch-01", status: RESOLVED, resolution: "the 1984 parte. She reads the winter the valley emptied, written by a woman who stayed, and sees her own erasure in it (ch-05)", resolved_at: "ch-05", deferred_reason: null }
  - { id: D-006, kind: character, description: "Nuria's father, the mountain guide in Arguello, dead and not discussed", opened: "ch-01", status: RESOLVED, resolution: "paid by action and never by statement - the first snow, the cleared screen, a reading that had to be right (ch-09)", resolved_at: "ch-09", deferred_reason: null }
  - { id: D-007, kind: mystery, description: "Tomas could not read (ch-08) and FerMin could (ch-10)", opened: "ch-08", status: DEFERRED, resolution: null, resolved_at: null, deferred_reason: "deliberately left unconfirmed. Elvira says 'mi hermano sabia leer' once, does not say whether she knew in 1986 or found out later, and does not repeat it - the asymmetry with Tomas is the payload and explaining it would dissolve it. This is the one piece of information the book hands over and refuses to cash." }
  - { id: D-008, kind: object, description: "the two letters stamped ZARAGOZA among nine that should all be from Benasque", opened: "ch-06", status: DEFERRED, resolution: null, resolved_at: null, deferred_reason: "a real question the book opens and does not answer, deliberately. It is the last thing Nuria notices and it points at a network the narrative never enters; resolving it would make this a mystery novel, which research/01-market.md rules out. Nuria's own reaction - asking the wrong question out loud in an empty kitchen at four in the afternoon - is the resolution: she sees it and moves on, which is the character's whole arc." }
  - { id: D-009, kind: promise, description: "can attention, offered decades late, discharge a debt that was never acknowledged?", opened: "ch-03", status: DEFERRED, resolution: null, resolved_at: null, deferred_reason: "this is the theme, not a thread. The foundation forbids the book from answering it: the station is not saved, nobody forgives anybody, and the tea is made anyway. Deferring IS the resolution." }
  - { id: D-010, kind: clock, description: "what was decided in 1983 and by whom - the order that automated the station and moved Elvira", opened: "ch-04", status: DEFERRED, resolution: null, resolved_at: null, deferred_reason: "deliberately not the subject. Naming an official villain converts a book about attention into a book about blame. The order is referred to three times and never explained, and the reader's refusal to be given it is the point." }