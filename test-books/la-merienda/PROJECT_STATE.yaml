    pressure_seed: "a letter arrives misaddressed"
  premise:
    logline: "A weather observer is sent to close a mountain weather station for the winter and finds, in its mailbox, a letter that has been waiting since 1983. The old woman who kept the station before her comes up the pass every Thursday because she was told someone would be there."
    note: "The niche drawn from the pool is 'tea ceremony second person' - the ritual is the structural spine and the narrator is second person, both decisions read straight off the rolled shelf rather than chosen."
  rulings:
    - id: R-001
      date: 2026-10-05
      ruling: "The drafting pass emits stray characters from other scripts (CJK, Cyrillic), English words inside Spanish sentences, and truncated fragments. Every existing gate misses them: a Cyrillic word is still a word and check-length counts it."
      decision: "maintenance/check-manuscript-integrity.py written and run as a per-chapter repair loop. It is NOT a prose gate and is not in GATE_FREEZE.md - it measures whether the file is the language it claims to be, which is a different question from whether the prose is good."
