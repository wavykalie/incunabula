  roll:
    seed: 594517907
    pool_size: 1000
    command: "python tools/roll-brief.py --seed 594517907 --pool-size 1000 --dice 1"
    dice: 1
    dice_note: "This roll was made 2026-10-05, BEFORE roll-brief.py gained dice 2. Dice 2 removed the language draw entirely - the button is English-only now - so the seed alone no longer re-derives this brief and --dice 1 is required. The brief itself is unchanged."
