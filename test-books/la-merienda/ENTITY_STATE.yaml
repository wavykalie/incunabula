# ============================================================================
# ENTITY_STATE.yaml — La merienda
# Built from research/03-foundation.md, 2026-10-05, at checkpoint one.
# Every name, age, date and physical fact the text may rely on is here.
# If the manuscript contradicts this file, one of the two is wrong and the
# discrepancy is a finding, not a preference.
# ============================================================================

entities:

  # --- people ---
  - id: nuria
    name: Nuria Bel
    age: 38
    role: protagonist, narrator (second person)
    occupation: weather observer, contracted to keep station 12-340 at Puerto de la Nieve for one winter
    history:
      - "Twelve years producing forecasts for a civil-protection service. No field observation since 2014."
      - "Her father, Tomás Bel, was a mountain guide in Argüello. Dead, not discussed in the text."
    competence: "Siting and reading a Stevenson screen; keeping a written record that will still be usable in forty years."
    damage: "Under pressure she becomes procedural - numbered, impersonal, mid-conversation - adding precision she does not have."
    blind_spot: "Believes a record is neutral. Keeping one is a choice about what counts."
    register: "close second person; measurement before feeling; the reader is told her states as instrument readings"
    first_appears: chapter-01

  - id: elvira
    name: Elvira Sarnago
    age: 81
    role: the previous keeper of the station
    residence: "Benaque, a village 1.9 km below the pass; 2 hours on foot"
    history:
      - "Kept station 12-340 for thirty-one years, 1952-1983."
      - "Married to Tomás Sarnago, died 1979. Not replaced."
      - "Left in 1983 without being told she was leaving. The house was 'kept for the summer'."
      - "Never opened the mailbox in thirty-one years, nor in the fourteen after."
    brother: fermin
    rule: "Never open the mailbox. This is stated as a fact before it is stated as a reason."
    competence: "Reads weather off one look at the sky and trusts her eyes over the instruments."
    damage: "Performs cheerfulness as a wall; tells the same story three times with three different endings, watching to see if you catch the change."
    blind_spot: "Believes what was taken from her was taken cleanly."
    address: "Uses usted with everyone, including Nuria, until chapter 8. Uses tú once, in chapter 8, and never explains it."
    first_appears: chapter-03

  - id: fermin
    name: Fermín Sarnago
    status: "dead 1989, Wolfsburg"
    role: "Elvira's younger brother"
    history:
      - "Emigrated to Wolfsburg in 1980."
      - "Wrote twice: 1981 (returned, destinatario desconocido) and 1983 (the letter Nuria opens)."
    voice: "German with small wrongnesses; short sentences that end too early; signs off too formally."
    rule: "He must not sound like a device. Two letters, both short, both fail to say the thing."

  - id: merce
    name: "Mercedes alias Merce"
    age: 64
    residence: Benaque
    role: "the village's narrator of other people's lives"
    damage: "Fills gaps, and every fact tilts so that she is nearer the centre of it."
    rule: "Not a liar. Memory as a social instrument."
    first_appears: chapter-04

  - id: paco
    name: "Paco Alias"
    age: 47
    role: "the carrier; said the thing that started it"
    detail: "Told Elvira in 2019 that there would be somebody at the observatorio this winter. Does not clearly remember saying it."
    rule: "Six lines per scene at most."

  - id: tomas-sarnago
    name: "Tomás Sarnago"
    status: "dead 1979"
    role: "Elvira's husband; the addressee of the ninth envelope"
    note: "Never appears. Never speaks. Exists as a name in an address."

  # --- places ---
  - id: puerto
    name: "Puerto de la Nieve"
    altitude_m: 1640
    role: "the pass, the station, and the book's only set"
    detail: "Road pass above Benasque. In the reservoir from November to April you can see the drowned villages from the station window."

  - id: station
    name: "Estación 12-340"
    role: "the weather station; the observatory, the garita, the house"
    contents: "Stevenson screen, wet- and dry-bulb, maximum and minimum thermometer, wind vane, rain gauge, the parte (log book), a kitchen, four rooms, a telephone that works on Wednesdays"
    history: "Automated 1983. Staffed by hand ever since - badly, continuously, by three people: Elvira, then a regional post with nobody in it, then Nuria."

  - id: benasque
    name: Benasque
    role: "the village below; everything social happens here"
    detail: "Population 340 and falling. One bar, one shop, one church with the roof repaired twice."

  - id: reservoir
    name: "Embalse de Benasque"
    role: "visible from the window; the thing that took the valley"
    history: "Filled 1981-1986. Six villages are under it."

  # --- objects ---
  - id: box
    name: "la caja"
    role: "the mailbox, and then the whole book"
    rule: "Metal, wall-mounted outside the station door. Nine envelopes. Nuria opens it in chapter 1 and carries it inside in chapter 2. It stays in the book, indoors, for the rest of the novel."
    contents_detail: "2 returned (1981, 1982, stamped destinatario desconocido); 5 from Fermín 1983-1989; 1 addressed to Tomás Sarnago, 1984, which is Elvira's own and is never opened by anyone in this book."

  - id: kettle
    name: "la tetera"
    role: "the ritual instrument"
    rule: "Whistles for a different length of time in every appearance. It is the only object in the book that is described with affection rather than measurement."

  - id: parte
    name: "el parte"
    role: "the log book; the book's mirror"
    rule: "Continuous 1952-1997, one line per observation, in at least four hands. The 1984 volume is the centre of gravity (chapter 5)."

  - id: cup
    name: "la taza rota"
    role: "the chipped cup"
    rule: "Elvira brings it. Nuria does not replace it. Two people drink from the same chipped cup on eleven Thursdays."

  # --- timeline ---
  - id: t-1952
    year: 1952
    event: "Elvira arrives at the station aged 50. Tomás is alive."
  - id: t-1979
    year: 1979
    event: "Tomás Sarnago dies. Elvira is 58. Not replaced."
  - id: t-1980
    year: 1980
    event: "Fermín emigrates to Wolfsburg."
  - id: t-1981
    year: 1981
    event: "First letter from Fermín. Returned, destinatario desconocido. The reservoir begins filling."
  - id: t-1982
    year: 1982
    event: "Second letter, also returned. Elvira leaves the station in the autumn."
  - id: t-1983
    year: 1983
    event: "14 October. Fermín's 1983 letter is posted and never collected. The station automates. Elvira posts her first letter to Tomás into a box she will not open."
  - id: t-1984
    year: 1984
    event: "The ninth envelope. The volume of the parte that the village empties into is written by Elvira and by nobody else."
  - id: t-1986
    year: 1986
    event: "The reservoir is full. Six villages under it."
  - id: t-1989
    year: 1989
    event: "Fermín dies in Wolfsburg. The last of his letters."
  - id: t-1997
    year: 1997
    event: "The last postmark in the box. Fourteen letters, one a year."
  - id: t-2019
    year: 2019
    event: "Paco the carrier tells Elvira there will be somebody at the observatorio this winter. She begins walking up."
  - id: t-now
    year: "present"
    event: "November. Nuria arrives. Eleven Thursdays."

# ---------------------------------------------------------------------------
# world_rules - binding, and true everywhere in the text
# ---------------------------------------------------------------------------
world_rules:
  - "Snow above 1,400 m from November. The station is at 1,640 m."
  - "The Embalse de Benasque was filled between 1981 and 1986. Six villages are under it, and Nuria can see the water from the station window."
  - "The station automated in 1983 and has been staffed by hand ever since, badly and continuously, by three people."
  - "Thursday is a working day at the station and the day the carrier comes. The merienda is at four."
  - "Nobody dies in this book. Not one character, and nobody offstage in a way the text could have shown."
  - "The mailbox contains nine envelopes at the moment Nuria opens it. This is checkable and must never drift."
  - "The postmarks in the box run 1983 to 1997 inclusive: fourteen years, one a year (chapter 7's count)."
  - "The narrative is second person throughout. No chapter may slip into first or third."
  - "No one in this book says 'I forgive you.' Nobody forgives anybody."
  - "Every warm beat costs something in the same paragraph. This is the anti-sentimentality rule from the voice matrix and it is enforced."