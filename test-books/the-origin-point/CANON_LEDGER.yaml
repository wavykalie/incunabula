people:
  - id: "P-001"
    name: "Delphine Rusk"
    role: "protagonist — regional fire investigator, covers a one-town county"
    age: 37
    canon:
      - "Left the county at 19; her family home burned in 2019, four doors from her mother's (FACT-001)"
      - "Was 31 in 2019 — a junior investigator four months into the post. She SIGNED the 2019 determination; the circuit reference was on the form and nobody asked her to check it (premise.md §2, CRIT-001/002)"
      - "Has not believed the electrical determination privately for six years (OUTLINE ch 4)"
      - "She is the only person professionally qualified to certify the 2025 fire, and she is also its most compromised witness (premise.md §2)"
      - "Signed her own complicity out loud, in a room, to a person (OUTLINE ch 23)"
      - "Takes the county post that keeps her in the county, ostensibly for the investigation (OUTLINE ch 29)"
    lie: "I certify fires. I do not have a stake in what they were."
    wound: "Six years of privately suspecting her own home, and never once being asked to look again"
    chaos_profile:
      irrelevant_obsessions: ["whether a burn pattern is 'right' before she has a photograph of it; she will not certify a fire she has not walked twice"]
      cognitive_distortion: "Reads the town's helpfulness as a single coordinated thing, which makes her slow to accept that seven people can mean it separately and still arrive at the same silence"

  - id: "P-002"
    name: "Roy Halloran"
    role: "volunteer fire chief, 61; Cora Vance's neighbour"
    canon:
      - "Arrived at the 2019 fire in four minutes from eleven blocks away — too fast (FACT-004, OUTLINE ch 12)"
      - "Was the first responder in 2019 and has never described what he saw on the way (OUTLINE ch 12)"
      - "Did not see a fire. He saw a person leaving a fire (OUTLINE ch 12)"
      - "His kindness to Rusk occurs only when others are watching (FACT-005, OUTLINE ch 17)"
      - "Deliberately unhelpful, in a warm way — never uncooperative (ledger item 13)"
    lie: "I do not know anything. I put out fires and I go home."
    wound: "He was there in 2019 and has spent six years being the reason nothing was asked"
    chaos_profile:
      irrelevant_obsessions: ["checks the volunteer roster every single morning, has done since 2019, has never missed a day, has never said why"]
      cognitive_distortion: "Believes that being useful to people in a small town is a form of atonement, and has never tested whether it is"

  - id: "P-003"
    name: "Cora Vance"
    role: "Rusk's mother, 74. Lives in the house on the street where the 2025 fire is"
    canon:
      - "Made the 2019 determination 'true' by not contradicting it (FACT-003, OUTLINE ch 27)"
      - "Alone in the house the week of the 2019 fire; her son was out of the country (FACT-006, OUTLINE ch 13)"
      - "Line, in ch 27, verbatim: 'I didn't light it. I made it true.' (premise.md §5)"
      - "Named as a 'friend' of Terrell in his 2019 alibi, which is a lie (FACT-006, OUTLINE ch 15)"
    lie: "What happened in that house is a private matter and the respectful thing is to let it lie."
    wound: "She is the reason the town had a decision to make, and she made it alone, in one afternoon"
    chaos_profile:
      irrelevant_obsessions: ["keeps the kitchen clock eleven minutes fast; has for years; the reason is not hers to give"]
      cognitive_distortion: "Believes her own complicity is a form of privacy. It is not. She knows it is not."

  - id: "P-004"
    name: "Terrell Vance"
    role: "Cora's son, Cora's grandson, Rusk's nephew. The 2025 arsonist"
    age: 36
    age_note: "Aged DOWN from 38 by WARN-001: at 38 he was a year older than his aunt, which reads as an error. At 36 he is two years younger, which reads as entanglement — and the entanglement is the engine. Cousin-and-aunt is the right relationship for a secret this old."
    canon:
      - "Was 'with friends' in 2019; the alibi has an identifiable gap and the named friend is his own mother (FACT-006, OUTLINE ch 15)"
      - "The only surviving witness to 2019 (premise.md §4)"
      - "Set the 2025 fire on the same block, in the same room type, with the same pour signature (FACT-002)"
      - "The motive is the inheritance, and finishing what Cora could not do herself (OUTLINE ch 24)"
      - "CULPABILITY: responsible but not the killer. Set by orchestrator per user instruction; flagged as CONF-004 for check at the outline stage (see conflicts)"
    lie: "I am the only one in this family who is actually angry about it."
    wound: "He watched a 20-year-old woman let his mother take the blame and decided someone eventually would pay for it"
    chaos_profile:
      irrelevant_obsessions: ["keeps his grandmother's kitchen clock wound, does not know it is eleven minutes fast, has never mentioned it"]
      cognitive_distortion: "Believes rage is a form of loyalty, and has never had anyone correct him on the difference"

  - id: "P-005"
    name: "Denny Aylward"
    role: "mechanic, town garage. Sold the accelerant, both times"
    canon:
      - "Sold 340 gallons in 2019 and 260 gallons in April 2025, cash, no vehicle, no delivery address (FACT-007, OUTLINE ch 5, 16)"
      - "Answers every question in order without being asked to (premise.md §4)"
      - "Was told what the fuel was for. He has the name of who told him (OUTLINE ch 25)"
      - "Has been waiting nineteen years to tell someone, and has picked the wrong moment twice (OUTLINE ch 25)"
    lie: "I sell fuel to people. I don't ask what they do with it."
    wound: "He was the convenience, and he has never been anything else, and he knows the difference now"
    chaos_profile:
      irrelevant_obsessions: ["logs every gallon in a hardback book, has since 2003, including the ones he should not have logged"]
      cognitive_distortion: "Believes complicity is expiable by eventual disclosure. He is going to test that in ch 25."

  - id: "P-006"
    name: "Adela Iversen"
    role: "county coroner"
    canon:
      - "The 2019 cause of death was NOT smoke inhalation, and ONE person died (FACT-008, OUTLINE ch 4 count planted, ch 10 stated)"
      - "She signed that. She will say why on the record, or she will say it at all (OUTLINE ch 10)"
      - "Suppressed finding, dated and timestamped, produced in ch 18 (ledger item 7)"
      - "Never unkind, never helpful (premise.md §4)"
    lie: "My job is the body. The rest of it belongs to people who were there."
    wound: "She knew in 2019 and certified around it, because the alternative was dismantling a town she grew up in"
    chaos_profile:
      irrelevant_obsessions: ["the compression of the 2019 file, measured twice, in different pens"]
      cognitive_distortion: "Believes professional neutrality is a real thing that exists, rather than a courtesy she performs"

  - id: "P-007"
    name: "Sam Okafor"
    role: "pastor, 44"
    canon:
      - "Line, verbatim: 'we don't really have a fire here' (OUTLINE ch 3)"
      - "Gives Rusk a list of who was in that house the night of 2019. The list has one name too many (FACT-009, OUTLINE ch 14)"
      - "Knows who was in the building that night, and who wasn't (premise.md §4)"
    lie: "People are not lying. They are just not saying it yet."
    wound: "He has been holding a list for six years and has been waiting for permission to hand it over"
    chaos_profile:
      irrelevant_obsessions: ["knows every family in the county by which child was baptised when, and recites it under his breath while cooking"]
      cognitive_distortion: "Believes a withheld truth is still a kindness, if you are gentle about the timing"

