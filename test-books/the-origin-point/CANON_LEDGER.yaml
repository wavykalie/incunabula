  - id: "CONF-004"
    status: "OPEN — flagged at outline stage per user instruction"
    scope: "ch 22-24, the ending"
    question: "Is Terrell's 'responsible but not the killer' framing going to read as fair play, or as a cheat?"
    why_open: "User instruction was explicit: the orchestrator decides, then flags it for check at the outline stage. Set as responsible-but-not-killer in outline.md ch 24. This is the SAME fork that killed premise 1's CONF-001 unasked, so it is being raised while the outline still exists and can be changed."
    specific_risk: "The concessions already made: Rusk's complicity is resolved on the page (ch 23) per A8. If the reader gets closure on the investigator and then discovers the antagonist was let off, the ending reads as protecting a sympathetic character. F5 (the trade wants closure) cuts against leniency for Terrell specifically, because he is the least sympathetic person in the book."
    proposed_fix_if_it_cheats: "OUTLINE ch 23 is the shortest structural distance between verdict and reader verdict, and it is the place to add the consequence. Ch 23 is currently 1,700 words and is the natural place to make the cost explicit."
    raised: "2026-09-27"
    owner: "human"
    blocks: "Phase 3 drafting of ch 22-30. Does NOT block Phase 1.5, 2.5, 2.7, 2.8."

  - id: "CONF-005"
    status: "OPEN — housekeeping, deliberate"
    scope: "Phase 3 precondition"
    question: "Rename the project? 'A Matter of Record' described premise 1's records premise and describes nothing in premise 2."
    why_open: "A directory rename on Windows fails loudly and late — in PROJECT_STATE.yaml paths and in any gate run against the old path. Doing it mid-run is worse than doing it explicitly. A new title has to be derived first, and a title is a human-facing commercial artifact."
    raised: "2026-09-27"
    owner: "human"
    blocks: "Phase 3. Must be closed before any gate is run against the renamed book."
