world_rules:
  - "The county is the record. Where the county and a person disagree, the county's copy is the one that counts legally."
  - "A card can be removed from an index; a document cannot be unfiled without a signature. The 1996 request worked because it was signed."
  - "Nobody has inspected the annex since 1962. Nobody is required to."
  - "The demolition is scheduled and legally defective. The defect is known to the commissioner."

conflicts:
  - id: "CONF-001"
    status: "OPEN — escalated, not decided"
    scope: "blocking for chapters 24-30"
    question: "Is Caudle responsible-but-not-killer (current outline) or a killer?"
    why_escalated: "Changes the moral center of Act III. `content_boundaries` reserves ending-ambiguity decisions to a person, and this is adjacent to one."
    raised: "2026-09-27"
    owner: "human"
  - id: "CONF-002"
    status: "CLOSED — answered by Phase 1 /scout, 2026-09-27"
    scope: "non-blocking"
    question: "Phase 1 (/scout) has not run. Comps are unverified orchestrator knowledge."
    raised: "2026-09-27"
    owner: "human or /scout"
    blocks: "Phase 6 packaging only. Drafting may proceed."
    resolution: "ANSWERED, AND THE ANSWER IS MOSTLY BAD. 2 of 6 recalled comps do not exist (Yarbrough 'The Bureau of Missing Persons'; Peter Ho Davies 'The Dying Light' and its series 'Devils and Dusters'). 3 further entries carried wrong years. A3 falsified - see research/market-research.md. Package this book against the CORRECTED comp set."
  - id: "CONF-003"
    status: "OPEN — escalated, not decided"
    scope: "BLOCKING for Phase 2.5 (/voice-matrix) and all drafting"
    question: "A3 is falsified. Two claims died - (a) the records-clerk protagonist is an unoccupied slot, (b) the quiet middle of the market still exists. The surviving distinction (records-as-the-crime, no procedural to join) is real but unproven, and both comparable momentum-less comps were received DISAPPOINTINGLY by readers. Proceed, reposition, or change the premise?"
    why_escalated: "The stated rule before the premise was written was: if the research shows the market has moved against a slow documentary procedural, CHANGE THE PREMISE rather than write it anyway. The research came back MIXED, not clean against - a dead load-bearing assumption is not the same as a dead premise. But the remedy now is a REPOSITIONING decision about how the book is sold, and that is a judgment about a published book, not a mechanical one. `content_boundaries` and the suite's own discipline both put this with a person."
    evidence: "research/market-research.md sections 2, 3, 5. Baragwanath 'Paper Cage' (Knopf 2024) occupies the protagonist slot. CrimeReads 2025 best-of 20 contains no quiet documentary procedural. Murder & Mayhem 2025-12-30 reports a bifurcation between escape-reading and dark-reading."
    options_presented:
      - "PROCEED AS-IS - full literary documentary mystery. Highest craft ambition, highest risk. Betting that a debut with no series momentum can win readers who are not currently served this shape - against every comparable signal."
      - "REPOSITION - keep the mechanism, sell the deception. Add a live external threat so there is a procedural to join; the records stay the access, not the only thing happening. This is what the trade evidence actually supports."
      - "CHANGE THE PREMISE - abandon the documentary engine. Cheapest to the reader, most expensive in sunk Phase 2 work, and discards a mechanism that genuinely had no comp."
    raised: "2026-09-27"
    owner: "human"
    blocks: "Phase 2.5 (/voice-matrix), Phase 2.7, Phase 2.8 (/collator), and all Phase 3 drafting. The premise drives the voice matrix, so building it now risks building it against a premise that will not survive."
