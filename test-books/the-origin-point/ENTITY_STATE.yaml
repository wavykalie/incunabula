# ENTITY_STATE — The Origin Point
# Phase 2.7, /case-keeper, BUILD (SEED mode).
#
# MODE AND ITS CONSEQUENCE, READ THIS FIRST
# ==========================================
# case-keeper Rule 6 requires every entry to carry a source of the form ch-XX:pYY.
# THIS FILE HAS NOT ONE. There are no chapters. This is a SEED, built from
# premise.md, outline.md and CANON_LEDGER.yaml before Phase 3, and every source
# below points at one of those instead.
#
# That is not a technicality. A seeded entry says "this is what the plan intends."
# An extracted entry says "this is what the text says." Only the second kind can
# catch a writer who contradicted the plan, and that is the whole job of this file.
# So: this file can catch *plan-internal* contradictions before drafting. It CANNOT
# catch a draft that drifts from the plan. That capability arrives at Phase 3.7
# (UPDATE mode) and /collator must not treat this file as if it already has it.
#
# WHY SEED mode and not a hand-built substitute: premise 1 hand-built
# CANON_LEDGER.yaml and skipped this file, and it cost the project its entire
# continuity gate. This file is now 3 phases old debt and is being closed properly.

