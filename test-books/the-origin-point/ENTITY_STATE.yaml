world_rules:
  - { rule: "No character in this book ever refuses Rusk a question. Not once, not in a minor part. This is a plant (ledger item 13), not a coincidence.", source: "artifacts/02-voice-matrix.md" }
  - { rule: "Close third, past tense, locked to Rusk. No exceptions.", source: "artifacts/02-voice-matrix.md" }
  - { rule: "Cora never uses a personal name; Terrell never finishes a sentence. Neither may be broken to accommodate a scene.", source: "artifacts/02-voice-matrix.md" }
  - { rule: "Register is quiet, not gentle. Nobody performs grief. Flatness is intentional.", source: "research/bestseller-dna.md §F rule 4" }
  - { rule: "The three 2025 deaths and the 2019 death are never graphically depicted (content_boundaries).", source: "PROJECT_STATE.yaml content_boundaries" }
  - { rule: "No sexual content involving minors. The 2019 death is off-page.", source: "PROJECT_STATE.yaml content_boundaries" }
  - { rule: "Institutional corruption is real but individual; no character is a pure villain.", source: "PROJECT_STATE.yaml content_boundaries" }

