# ============================================================================
# A MATTER OF RECORD — primary state
# Mode: NEW. Primary state file: PROJECT_STATE.yaml (STATE.yaml not created;
# check-length.py reads PROJECT_STATE.yaml, so it is the one that must carry
# the length contract. See note under phase.history).
#
# NOTE ON ORDER: check-length.py reads only the first 8,000 characters of this
# file. The length keys are therefore in the `project:` block at the top, not
# appended at the end. This is the book-1 root-cause fix: the emperors book
# shipped with target_range_words [0,0] because nothing held a floor.
# ============================================================================

project:
  title: "The Origin Point"
  genre: "mystery"
  subgenre: "procedural mystery / documentary mystery"
  target_audience: "Adult trade readers of literary-leaning commercial mystery; readers of Yarbrough, Tudor, Griffiths, Banville"
  language: "English (US)"
  market: "trade print + ebook; North American and UK"
  positioning: "full-length novel"

  # ---- LENGTH CONTRACT (read by check-length.py, first 8k chars) ----
  target_floor_words: 80000
  target_ceiling_words: 95000
  target_range_words: [80000, 95000]
  word_count_target: 90000
  chapter_count_planned: 30
  average_words_per_chapter_planned: 3000

  premise: 2              # PREMISE 2. Premise 1 (documentary engine) FALSIFIED by /scout and abandoned by human decision CONF-003, 2026-09-27. Archived, not deleted: archive/p1-documentary-2026-09-27/
  device: "fire-investigation mechanism - a poured origin-point signature links the 2025 fire to the 2019 fire the investigator's own family home lost. The investigator is the only person qualified to certify the first and the most compromised witness to it."
  working_title_note: "RESOLVED as CONF-005, 2026-09-27. Title and directory are now the-origin-point. Chose the fire-investigation term meaning both where the fire started and the thing that has to be got right — and it is also the ch 2 and ch 8 hinge."
  comp_titles:            # VERIFIED Phase 1 /scout 2026-09-27 - see research/market-research.md
    - "Baragwanath, Paper Cage (Knopf 2024; NZ 2022) - THE POLE COMP. Police-station records clerk, small town, Ngaio Marsh finalist + 2025 Barry nominee. FALSIFIES A3: the records-clerk protagonist slot is occupied."
    - "Banville, The Untouchable (1997, Picador/Knopf, 304pp) - VERIFIED. literary pole; the archive as power structure. Literary fiction, so not a commercial template."
    - "Tudor, The Burning Girls (2021) - VERIFIED, year corrected. THE CAUTION: great premise, disappoints at the 80% mark."
    - "Doughty, Apple Tree Yard (2013) - VERIFIED, year corrected. moral complexity without a procedural spine; 3.5/5, read as tooapy."
    - "Griffiths, The Dark Angel (2016, Quercus) - VERIFIED. professional-in-the-field model. WEAK: book 10 of 15, viability from series momentum not premise."
  comp_titles_retired:   # did not survive verification - see research/market-research.md
    - "Yarbrough, The Bureau of Missing Persons (2017) - DOES NOT EXIST. Fabricated. Was flagged 'closest comp, confidence: high'."
    - "Peter Ho Davies, The Dying Light (Devils and Dusters III) - DOES NOT EXIST. Author real; title and series fabricated. Author's novels: Ugliest House 1997, Welsh Girl 2007, Fortunes 2016, A Lie Someone Told You 2021."
  # Phase 1 /scout found the market has BIFURCATED (escape-cozy vs dark-deceptive).
  # No quiet documentary procedural appears on the 2025 best-of lists at all.
  # Positioning consequence - sell the deception, not the filing date.
  positioning_note: "Do NOT market as a documentary procedural. Evidence (Class A, /scout): trade reporting describes a bifurcation between readers who want escape and readers who want the dark end, with no quiet middle; the 2025 CrimeReads best-of 20 contains no book of this shape. The small-town books that DO place are quiet in SETTING and propulsive in STRUCTURE - body, chase, deception, detective. Records are the ACCESS, not the CAST: raise ensemble, per the Thursday Murder Club / Picking Up the Pieces signal."
  engagement_type:
    primary: "intellectual"
    secondary: "fascination"
    tertiary: "empathy"

  # Dimension 7 for this project. Not "market" on purpose: for a fair-play
  # mystery the load-bearing dimension is whether an attentive reader can
  # reconstruct the mechanism, not whether the market is legible.
  dimension_7:
    name: "Solvability"
    definition: "An attentive reader can reconstruct who moved the 1973 report, when, and why, from planted clues visible on first read. 8.0+ = solvable from the text. 8.5+ = solvable on a second read."
  content_boundaries:     # §7 escalation surface - nothing here is decided by the orchestrator
    - "No sexual content involving minors. The 1973 death is off-page and is never depicted."
    - "No graphic depiction of the fall or of the body."
    - "Institutional corruption is real but individual, not systemic-fatal: no character is a pure villain."
    - "Ending ambiguity on one question (Wren's culpability) is PERMITTED and required."
  created: "2026-09-27"
  updated: "2026-09-27"

