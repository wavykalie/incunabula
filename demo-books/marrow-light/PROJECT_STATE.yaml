# NOTE ON LENGTH - the ONE place a number describes how long something should be.
#
# This is a book-level contract with the author, enforced by check-length.py, and it is
# legitimate for exactly that reason: it is an agreement about a finished object, not an
# instruction to a writer about the shape of any chapter.
#
# There is no per-chapter target anywhere in this project. See DRAFTING_FRAMEWORK.md, which
# is a convention and not a finding, and which explicitly permits exactly this: "The book.
# A declared total length for the whole manuscript is a real contract with the author."
#
# The floor is declared AT the premise stage rather than after drafting, which is the
# difference between this book and muzzle-and-marrow (floor declared late, missed by
# 5,314 words, and recorded as a failure). A number that is written down before anyone can
# see the result is a number you can honour.

