# THE LENGTH FAILURE - read before any revision pass.
#
# The floor was declared IN ADVANCE, in September, at premise stage, before a word of prose
# existed. That was the deliberate difference from muzzle-and-marrow, where the floor was
# declared after the first gate run and then missed by 5,314 words.
#
# The book came in 21,930 words short. 78,070 against a declared 100,000.
#
# WHAT THIS FILE DOES NOT DO: it does not move the floor. A declared target that is revised
# after the result is visible is not a contract, and this project's standing position on that
# is in DRAFTING_FRAMEWORK.md and ERRATA.md, and it applies to a target that was missed
# exactly as it applies to one that was hit.
#
# The temptation, named so a later session does not act on it without seeing it: the U1 row
# WANTS a longer book, the L1 row REQUIRES one, and both can be satisfied at once by
# expanding the short chapters. **That is the padding failure and it is the specific thing
# DRAFTING_FRAMEWORK.md exists to prevent.** Expanding ch 1 (1,438) or ch 12 (1,343) to hit a
# number would be a quota chapter written after the fact, which is worse than a short book,
# because it is a short book with a lie in it about why it's short.
#
# The real options, for the author, and NOT for an agent to pick:
#   1. Accept 78,070 as the book and re-declare the floor, recording that it was missed.
#   2. Write the material that is genuinely missing. If 22,000 words are missing, they are
#      missing because the book is 38 chapters, not 45 - and the architecture said so.
#   3. Leave it, and carry the failure in the colophon as a fact about the first book
#      drafted under a declared-in-advance floor.
#
# Recommendation is deliberately withheld. This is the author's contract and this file records
# the position, not a preference.

# What this book is evidence for, and what it is not.
# Stated before drafting, so a later session cannot read the numbers as support for
# something they do not support.
evidence:
  proves: >-
    Two things, both about this book and neither about the framework.

    ONE. A book drafted from scratch with no per-chapter length target of any kind - in the
    outline, in the emotional curve, in the drafting prompt, or in anybody's head - scored
    U1 CV 26.2% with a 2.77x range (1,343 to 3,721) and PASSED the gate. muzzle-and-marrow
    scored 12.1% on the same method over 10 chapters. The difference is not a technique that
    was adopted; it is that this book had 38 chapters instead of 10, and 38 chapters is
    enough shape for a distribution to be a distribution.

    TWO. U4 under real load. This is the first book in the project to declare
    commercial-dialogue before drafting, and it scored 65% single-line paragraphs against a
    market convention of 50-62%. ENFORCED, and passed, and it did so by being a
    dialogue-dense two-hander rather than by being tuned.
  tests:
    - "P1 and P2 in PREDICTION.md. P1 HELD at 86% against a 25.0 threshold. P2 HELD at 0.84 words of difference against a 3-word tolerance, but on a THREE-chapter window where ten were predicted. Both recorded, with the weakness named."
    - "The Blind Sort test on a two-hander. NOT YET RUN. It is the shape the foundation predicted would be hardest and it has not been tested."
  does_not_prove: >-
    It does not show that drafting without length targets produces the published band. CV
    26.2% is inside the WARN band and OUTSIDE the published fiction band of 33.4-45.1%. The
    book passed U1 and it is not a book in the shape the calibration corpus measures. That
    remains true and it is the same position DRAFTING_FRAMEWORK.md takes.

    It does not show anything about sentence length as a craft matter. P1 and P2 both held,
    and the full climb from chapter 11 to chapter 38 is 1.18 words. The pilot's ten-point
    climb did not recur. That is information about a number, and PREDICTION.md explicitly
    declines to convert it into a claim about how a book should be written.

    It does not show the framework's rule is anything but a convention. Nothing here tests
    that, and the two mechanisms offered in 2026 for it were both falsified.
