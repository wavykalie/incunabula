# press.yaml — the press and its author lines.
#
# WHY A PRESS NEEDS LINES
#   One engine, several authorial voices. The taste channel was single (the root
#   COMMONPLACE.md) while the catalogue already holds three different kinds of book:
#   a long literary novel, a short high-premise novel, and a short prescriptive
#   guide. Distilled taste from one is not taste for another — a preference earned in
#   the literary line ("let the wound stay open on the page") is exactly the
#   preference the prescriptive line must decline, because that line's reader came
#   for the usable thing.
#
# THE ISOLATION RULE
#   Each line reads ONLY its own taste store. A decision recorded in one line's
#   ledger is not evidence for another line, and nothing crosses lines except by an
#   explicit, dated author merge recorded in `press/PROMOTIONS.md`. This is the
#   three-channel firewall (SELF_IMPROVEMENT.md §2) applied one layer down: evidence
#   from one line may not move another, any more than evidence from one channel may
#   move another.
#
#   `python tools/press.py check` fails on a store shared by two lines, on a store
#   outside its own line's directory, and on a line pointing at the press-wide
#   ledger — a line that reads the shared file has no line. `cross` reports an entry
#   that appears in two ledgers: a preference in both has stopped being one line's.
#
# NOT A GATE
#   Nothing here is enforced against a book, and no line may move a threshold: a
#   measurement moves on a named corpus, never on a line's taste. The press decides
#   which contract a run is drafted under, not what the gates say.
#
# ASSIGNMENT
#   The `line:` key in BOOKS.yaml is the assignment, and it is the author's to make.
#   No entry carries one yet; `press.py check` names the books that are unassigned
#   rather than choosing for them. A book with no line is drafted under the root
#   COMMONPLACE.md alone, which is where every book in the catalogue was drafted.

press:
  name: "Merope Press"
  # The three lines are the three modes the catalogue already contains, and each
  # carries the books that are its evidence.
  lines:

    - id: folio
      imprint: "Folio"
      register: "long literary fiction; wound stays open on the page; endings refuse consolation"
      niches: ["literary fiction", "quiet historical", "domestic literary"]
      taste_store: "press/folio/COMMONPLACE.md"
      evidence: "test-books/marrow-light, test-books/the-origin-point, demo-books/muzzle-and-marrow"

    - id: quarto
      imprint: "Quarto"
      register: "short high-premise novel; one idea carried hard; momentum over polish"
      niches: ["short speculative", "high-premise novella", "climate fiction"]
      taste_store: "press/quarto/COMMONPLACE.md"
      evidence: "test-books/kagiroi-drift (Short Novel Edition)"

    - id: octavo
      imprint: "Octavo"
      register: "short prescriptive nonfiction; chapter-edge apparatus written quiet to every frozen row"
      niches: ["practical guides", "short nonfiction", "instructional"]
      taste_store: "press/octavo/COMMONPLACE.md"
      evidence: "test-books/quiet-hours, test-books/sons-of-heaven-v2"
