# The machine-readable declaration of the OPTIONAL EIGHT-PHASE COMPACT PIPELINE.
#
# SCOPE, stated first because a host reading only this file would otherwise conclude
# wrongly. The default production route is the `incunabula` engine (17 phases) running
# inside this contract layer. This file declares the compact pipeline, which a project
# selects deliberately - never as a silent substitution for the full engine, which the
# pipeline explicitly forbids.
#
# The two gates below apply across the whole run, on either route, and cannot be
# switched off.

prose_gate:
  required: true
  detail: "references/scoring/prose-gate.md"
  enforced_during: ["phase_3_drafting", "phase_4_devils_audit", "phase_6_final_score", "phase_7_colophon"]
  covers: "manuscript prose only - outlines, scene packets and state files are exempt"
  thresholds: "derived from published prose; banned outright only at zero corpus hits, otherwise capped as fractions"
  caps_query: "tools/deslop-check.sh --caps"
  control_run: "tools/validate-controls.sh"
  control_expectations:
    human_corpus: "zero failing rows"
    slop_fixture: "FAIL, with failing rows listed"
    machine_control: "mixed - some chapters fail, some pass; a blanket verdict means the scanner is not measuring"
    empty_target: "a directory that resolves to no files is a FAIL"
  verdict_on_failure: "the chapter, the score, or the package does not move forward"

maintenance_gate:
  required: true
  detail: "references/maintenance-protocol.md"
  schemas:
    ledger: "references/canon-ledger-schema.md"
    intake: "references/intake-schema.md"
  present_before_phase_0:
    - "CANON_LEDGER.yaml - series scope"
    - "CANON_LEDGER.yaml - book scope"
    - "live voice contracts inside voice-matrix.md"
    - "maintenance/PRUNING_LOG.md"
    - "maintenance/SESSION_LOG.md"
  check_in:
    - "open the primary state file, the canon ledger, the recent session entries and the phase prompt"
    - "verify every chapter's status and word count against the files on disk"
    - "scan changed files for new names, dates, places, objects, rules, relationships and knowledge transfers"
    - "fold duplicates into existing fact IDs; do not mint a second ID for a rephrased fact"
    - "attach provenance and a verification date"
  check_out:
    - "write the primary state file"
    - "write the canon ledger, the voice contract and the document registry"
    - "append a session entry covering decisions, changed files, facts merged, conflicts and the next step"
    - "append to maintenance/PRUNING_LOG.md"
    - "re-run the phase gate before reporting that the phase advanced"
  prohibitions:
    - "never close a contradiction quietly - hold both values with their sources and open a conflict record"
    - "never remove or archive a canonical source without logging its path, its replacement, the reason and the date"
    - "never report progress on a state file that has not been parsed"
    - "never backdate a layer installed late - record it as REPAIR, run late"
  state_parse: "the primary state file must parse; a malformed one means no downstream gate ever read it"
  pruning_log: "append-only, and it records restraint as well as removal - a decision not to prune is an entry"
  unanswered_precondition: "carry it on the record with its own status; a required artifact that is absent is a failure"
  verdict_on_failure: "the phase does not advance, and anything skipped is reported as skipped"

phase_0_intake:
  label: "Phase 0: Intake"
  prompt: "references/prompts/intake.md"
  gate: "intake"
  maintenance_gate: "required"
  produces:
    - "ASSUMPTIONS.md"
    - "artifacts/00-brief.md"
    - "artifacts/01-market-map.md"
    - "artifacts/02-story-engine.md"
  next: "Phase 1: Foundation"

phase_1_foundation:
  label: "Phase 1: Foundation"
  prompt: "references/prompts/foundation.md"
  gate: "foundation"
  maintenance_gate: "required"
  produces:
    - "artifacts/03-characters.md"
    - "artifacts/04-theme.md"
    - "artifacts/06-emotional-curve.md"
  next: "Phase 2: Architecture"

phase_2_architecture:
  label: "Phase 2: Architecture"
  prompt: "references/prompts/architecture.md"
  gate: "architecture"
  maintenance_gate: "required"
  produces:
    - "artifacts/05-outline.md"
    - "artifacts/07-opening-strategy.md"
  next: "Phase 3: Drafting"

phase_3_drafting:
  label: "Phase 3: Drafting"
  prompt: "references/prompts/drafting.md"
  gate: "drafting"
  maintenance_gate: "required"
  prose_gate: "required"
  produces:
    - "manuscript/chapters/"
  next: "Phase 4: Devil's Audit"

phase_4_devils_audit:
  label: "Phase 4: Devil's Audit"
  prompt: "references/prompts/devils-audit.md"
  gate: "devils_audit"
  maintenance_gate: "required"
  prose_gate: "required"
  produces:
    - "artifacts/08-devils-audit.md"
  next: "Phase 5: Fine Press Loop"

phase_5_fine_press_loop:
  label: "Phase 5: Fine Press Loop"
  prompt: "references/prompts/fine-press-loop.md"
  extra_reading:
    - "references/scoring/evaluator-protocol.md"
  gate: "fine_press_loop"
  maintenance_gate: "required"
  produces:
    - "evaluations/fine-press-loop.md"
    - "evaluations/revision-plan.md"
  next: "Phase 6: Final Score"

phase_6_final_score:
  label: "Phase 6: Final Score"
  prompt: "references/scoring/incunabula-score-codex.md"
  extra_reading:
    - "references/scoring/evaluator-protocol.md"
    - "references/scoring/prose-gate.md"
  gate: "final_score"
  maintenance_gate: "required"
  prose_gate: "required"
  produces:
    - "artifacts/09-incunabula-score.md"
  next: "Phase 7: Colophon"

phase_7_colophon:
  label: "Phase 7: Colophon"
  prompt: "references/prompts/editorial-package.md"
  gate: "colophon"
  maintenance_gate: "required"
  prose_gate: "required"
  produces:
    - "artifacts/10-colophon.md"
  next: ""
