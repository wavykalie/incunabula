# The specialist team.
# Each role names the skill that fills it, what it is responsible for, when it runs,
# what it reads and writes, and the conditions its work must satisfy.

market_researcher:
  label: "Market researcher"
  skill: "skills/scout/SKILL.md"
  mission: "Map the category as it stands: current comps, reader demand, promises the market already tolerates, metadata angles, and where the open space is — before the architecture hardens."
  timing: "Before foundation, and again whenever the market package changes."
  target: "Market evidence strong enough to defend the positioning."
  reads: ["ASSUMPTIONS.md", "artifacts/00-brief.md"]
  writes: ["research/market-research.md", "research/comps.md", "foundation/positioning.md"]
  gates:
    - "At least five current comp candidates, or an explicit blocker."
    - "The target reader and the reader promise stated in one sentence."
    - "Length and format expectations documented."
    - "No bestseller claim without evidence and launch arithmetic."

worldbuilder:
  label: "Worldbuilder"
  skill: "skills/series-binder/SKILL.md"
  mission: "Build the logic of the world — rules, institutions, constraints, setting economics, cultural pressure — and the continuity bible, without encyclopaedic bloat."
  timing: "Foundation and architecture for speculative, historical, thriller, mystery, series, or framed nonfiction work."
  target: "Coherence that creates story pressure."
  reads: ["ASSUMPTIONS.md", "artifacts/00-brief.md", "research/market-research.md"]
  writes: ["foundation/world-bible.md", "foundation/continuity-rules.md"]
  gates:
    - "Every rule creates pressure rather than background."
    - "Each major rule has a cost, an exception, and a dramatic use."
    - "Contradictions become tickets before drafting begins."

character_architect:
  label: "Character architect"
  skill: "skills/forme/SKILL.md"
  mission: "Design the cast — wounds, wants, contradictions, pressure voices, and the relationships that generate commercial stakes."
  timing: "Foundation, before the outline locks."
  target: "Characters and feelings strong enough to carry the book."
  reads: ["ASSUMPTIONS.md", "artifacts/00-brief.md", "foundation/positioning.md"]
  writes: ["artifacts/03-characters.md", "foundation/voice-map.md"]
  gates:
    - "Every principal has a conscious want, an unconscious need, a contradiction, and a pressure voice."
    - "At least one relationship produces recurring tension."
    - "The character promise matches what the target reader came for."

theme_engineer:
  label: "Theme engineer"
  skill: "skills/forme/SKILL.md"
  mission: "Make the theme a live question rather than a lecture, and build the motifs, anchors, identity effect, and re-read architecture that carry it."
  timing: "Foundation and architecture."
  target: "A theme that is felt and never declared."
  reads: ["artifacts/00-brief.md", "artifacts/03-characters.md", "foundation/positioning.md"]
  writes: ["artifacts/04-theme.md", "foundation/motif-map.md"]
  gates:
    - "The theme is a question, not an answer."
    - "Each act changes the reader's understanding of it."
    - "Motifs appear under pressure, not as decoration."

plot_architect:
  label: "Plot architect"
  skill: "skills/forme/SKILL.md"
  mission: "Design the outline, reversals, act turns, open loops, reveals, escalation, payoff map, and ending, with the propulsion the genre expects."
  timing: "Architecture."
  target: "Pace and coherence that hold."
  reads: ["artifacts/03-characters.md", "artifacts/04-theme.md", "foundation/world-bible.md", "foundation/positioning.md"]
  writes: ["artifacts/05-outline.md", "foundation/payoff-map.md"]
  gates:
    - "Each chapter changes the value state."
    - "Every setup has a planned payoff or a deliberate abandonment."
    - "Opening and ending honour the same reader contract."

pacing_engineer:
  label: "Pacing engineer"
  skill: "skills/setting/SKILL.md"
  mission: "Tune scene length, chapter endings, acceleration and deceleration, skim resistance, abandon points, and the pressure of the first ten pages."
  timing: "Architecture, drafting, and after-swarm revision."
  target: "Opening and pace that keep a reader moving."
  reads: ["artifacts/05-outline.md", "artifacts/07-opening-strategy.md", "manuscript/chapters"]
  writes: ["evaluations/pacing-report.md", "revision/pacing-tickets.md"]
  gates:
    - "The first ten pages make one clear contract with the reader."
    - "No two consecutive chapters end on the same hook type."
    - "Every slow passage serves feeling, clue, voice, or dread."

prose_writer:
  label: "Prose writer"
  skill: "skills/setting/SKILL.md"
  mission: "Draft chapters with voice, scene pressure, subtext, sensory concreteness, imperfect human texture, and chapter hooks — without optimising to a score mid-sentence."
  timing: "Drafting."
  target: "Prose that reads as one specific person."
  reads: ["artifacts/05-outline.md", "artifacts/06-emotional-curve.md", "foundation/voice-map.md", "foundation/world-bible.md"]
  writes: ["manuscript/chapters", "manuscript/chapter-reports"]
  gates:
    - "The chapter has concrete scene pressure and a value shift."
    - "The voice changes under pressure."
    - "Dialogue carries subtext or conflict."
    - "Nothing is symmetric-polished before the draft is complete."

continuity_editor:
  label: "Continuity editor"
  skill: "skills/press-ledger/SKILL.md"
  mission: "Track canon, timeline, facts, names, promises, clues, world rules, open loops, and the debt owed to the reader's contract."
  timing: "After every chapter block and before the devil's audit."
  target: "Coherence at the floor."
  reads: ["foundation/continuity-rules.md", "foundation/payoff-map.md", "manuscript/chapters"]
  writes: ["evaluations/continuity-audit.md", "revision/continuity-tickets.md"]
  gates:
    - "No accidental contradiction left unresolved."
    - "Every major open loop has a status."
    - "Contract debt is marked before scoring."

swarm_director:
  label: "Swarm director"
  skill: "skills/reader-swarm/SKILL.md"
  mission: "Run simulated reader panels, public-reaction scenarios, niche-risk proxies, heatmaps, interviews, and revision tickets; import from an external simulator when one is used."
  timing: "After the first full draft, after a major part, or before the package locks."
  target: "Calibrated audience signal."
  reads: ["foundation/positioning.md", "manuscript/chapters", "delivery/colophon.md"]
  writes: ["evaluations/book-swarm"]
  gates:
    - "Raw enthusiasm is calibrated downward."
    - "The worst cohort and the abandon points are documented."
    - "Simulated niche approval is never presented as real-world validation."
    - "Tickets are actionable without rereading the whole report."

devils_auditor:
  label: "Devil's auditor"
  skill: "skills/incunabula-codex/SKILL.md"
  mission: "Attack premise, structure, opening, pace, coherence, market promise, machine texture, and score inflation before any final score."
  timing: "Mandatory, before the fine press loop."
  target: "Blocks the final score until the audit exists."
  reads: ["manuscript/chapters", "evaluations/book-swarm", "evaluations/continuity-audit.md"]
  writes: ["artifacts/08-devils-audit.md"]
  gates:
    - "No final score until this exists."
    - "The weakest dimension is named."
    - "Score-inflation risks are documented."

revision_editor:
  label: "Revision editor"
  skill: "skills/corrector/SKILL.md"
  mission: "Apply structural, connective, texture, and factual fixes against the audit and swarm tickets without sanding the voice flat."
  timing: "After the devil's audit, before the final score and package."
  target: "The weakest dimension repaired to the floor."
  reads: ["artifacts/08-devils-audit.md", "evaluations/book-swarm", "revision/pacing-tickets.md", "revision/continuity-tickets.md", "manuscript/chapters"]
  writes: ["revision/revision-plan.md", "manuscript/chapters"]
  gates:
    - "Fix the weakest dimension before polishing the strongest."
    - "Preserve the voice anchors and the best scenes."
    - "Every blocking ticket is resolved or explicitly deferred with a reason."

scorekeeper:
  label: "Scorekeeper"
  skill: "skills/incunabula-codex/references/scoring/incunabula-score-codex.md"
  mission: "Score only after audit and revision, hold the calibrated threshold, and block publication claims when a floor dimension fails."
  timing: "Final score."
  reads: ["artifacts/08-devils-audit.md", "evaluations/book-swarm", "manuscript/chapters"]
  writes: ["artifacts/09-incunabula-score-codex.md"]
  gates:
    - "The weakest major dimension controls readiness."
    - "An average cannot hide a floor below target."
    - "A high claim requires evidence, calibration, and a blocker review."

package_strategist:
  label: "Package strategist"
  skill: "skills/colophon/SKILL.md"
  mission: "Build the logline, cover copy, synopsis, query, cover brief, metadata angle, and shareable hooks that match the manuscript instead of overpromising it."
  timing: "Packaging and any package-reaction loops."
  target: "A package that matches the book."
  reads: ["artifacts/09-incunabula-score-codex.md", "foundation/positioning.md", "evaluations/book-swarm"]
  writes: ["delivery/colophon.md", "launch/viral-hooks.md"]
  gates:
    - "The package promise matches chapter one."
    - "The hook is specific enough to spread."
    - "Backlash and misread risk are documented."
    - "No guarantee of bestseller status."

viral_framing_strategist:
  label: "Viral framing strategist"
  skill: "skills/bestseller-studio/SKILL.md"
  mission: "Design shareable premise frames, quote hooks, controversy boundaries, and platform angles, and test public reaction without confusing a hypothesis for a prediction."
  timing: "After the package draft, before the launch plan locks."
  target: "Shareability treated as a testable hypothesis."
  reads: ["delivery/colophon.md", "evaluations/book-swarm", "foundation/positioning.md"]
  writes: ["launch/viral-hooks.md", "launch/virality-test-plan.md"]
  gates:
    - "At least ten specific hooks, not slogans."
    - "The likely misread and backlash pattern documented."
    - "Every viral claim framed as a hypothesis."
    - "No hook promises content the book does not contain."

launch_strategist:
  label: "Launch strategist"
  skill: "skills/bestseller-studio/SKILL.md"
  mission: "Turn the market position into an advance-copy and review plan, content angles, a launch calendar, category assumptions, and virality tests."
  timing: "After the package gate, or before public launch."
  target: "Launch fit."
  reads: ["delivery/colophon.md", "launch/viral-hooks.md", "launch/virality-test-plan.md", "research/market-research.md"]
  writes: ["launch/launch-plan.md", "launch/content-angles.md"]
  gates:
    - "An audience acquisition path is named."
    - "The review and advance-copy strategy is documented."
    - "Viral tests are hypotheses, not predictions."
    - "Launch arithmetic is kept separate from manuscript quality."
