# ============================================================================
# BOOKS.yaml — the registry of books this framework governs.
#
# WHY THIS FILE EXISTS: an all-books suite once omitted a complete, finished
# book because the suite's book list was hand-typed into a report. Nothing
# enforced "every book appears". The registry is that enforcement: the suite
# reads this list, and `tools/check-registry.py` checks it in BOTH directions
# (every registered path exists; every PROJECT_STATE.yaml on disk is
# registered).
#
# WHAT IT IS NOT: a second length contract. The gates read each book's own
# PROJECT_STATE.yaml; this file carries only pointers and stage. Duplicating
# contracts here would create two places for a number to drift.
#
# status vocabulary: concept | drafting | complete | published | fixture | autonomous
#   autonomous = the random button (tools/roll-brief.py): a rolled niche, no author at
#   the wheel, checkpoints approved by subagent vote. Judged at its own gates.
# expected_manuscript: does the suite's prose gates apply to it?
#
# A book may exist on disk but be deliberately absent from this list (a private
# title). check-registry.py prunes those from its on-disk scan when they are
# named in .registry-private - a gitignored file, so the public repository
# never carries the name.
#
# An empty registry is not a pass. `tools/check-registry.py` exits 2 when it
# finds no registered books, and `tools/run-gates.sh` exits 2 when a book has
# no chapters. Both mean NOT RUN. Add your first book below.
# ============================================================================

books: []
